{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="themeColor">
<title>گزارشات هوش مصنوعی</title>
<script>
  /* اعمال تم قبل از رندر (جلوگیری از فلش) */
  (function(){var t;try{t=localStorage.getItem('theme')}catch(e){}
    if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
    document.documentElement.dataset.theme=t;})();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @property --deg{syntax:'<percentage>';inherits:false;initial-value:0%}

  :root,[data-theme="dark"]{
    color-scheme:dark;
    --bg:#000;
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
    --purple:#BF5AF2; --teal:#64D2FF; --indigo:#5E5CE6; --pink:#FF375F;
    --label:#F5F5F7; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3);
    --fill:rgba(255,255,255,.06); --fill-2:rgba(255,255,255,.12); --separator:rgba(255,255,255,.08);
    --glass:rgba(28,28,30,.55); --glass-border:rgba(255,255,255,.12);
    --shadow:0 12px 40px rgba(0,0,0,.45); --hi:inset 0 1px 0 rgba(255,255,255,.1);
    --search:rgba(118,118,128,.24); --seg:rgba(118,118,128,.22); --seg-thumb:rgba(255,255,255,.18);
    --ring-in:rgba(18,18,20,.92); --orb:1; --tip:rgba(30,30,32,.92);
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#F2F2F7;
    --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
    --purple:#AF52DE; --teal:#32ADE6; --indigo:#5856D6; --pink:#FF2D55;
    --label:#1C1C1E; --label-2:rgba(60,60,67,.65); --label-3:rgba(60,60,67,.35);
    --fill:rgba(120,120,128,.1); --fill-2:rgba(120,120,128,.16); --separator:rgba(60,60,67,.12);
    --glass:rgba(255,255,255,.72); --glass-border:rgba(255,255,255,.9);
    --shadow:0 10px 32px rgba(60,60,90,.12); --hi:inset 0 1px 0 rgba(255,255,255,.9);
    --search:rgba(118,118,128,.12); --seg:rgba(118,118,128,.14); --seg-thumb:#fff;
    --ring-in:rgba(255,255,255,.95); --orb:.5; --tip:rgba(255,255,255,.95);
  }
  :root{--r-lg:28px;--r-md:20px;--spring:cubic-bezier(.32,.72,0,1)}

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);color:var(--label);min-height:100vh;min-height:100dvh;overflow-x:hidden;
    padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
    transition:background .45s var(--spring),color .45s var(--spring);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;pointer-events:none;opacity:var(--orb);animation:drift 22s ease-in-out infinite alternate;transition:opacity .45s}
  .orb.a{width:480px;height:480px;background:rgba(10,132,255,.35);top:-120px;right:-100px}
  .orb.b{width:420px;height:420px;background:rgba(191,90,242,.28);bottom:-100px;left:-80px;animation-delay:-8s}
  .orb.c{width:360px;height:360px;background:rgba(100,210,255,.2);top:40%;left:35%;animation-delay:-15s}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(40px,50px,0) scale(1.12)}}

  .glass{
    background:var(--glass);
    backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
    border:1px solid var(--glass-border);border-radius:var(--r-lg);
    box-shadow:var(--shadow),var(--hi);
    transition:background .45s,border-color .45s,box-shadow .45s;
  }

  /* Navbar */
  .navbar{position:sticky;top:max(12px,env(safe-area-inset-top));z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;margin-bottom:20px}
  .nav-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent);padding:3px 10px;border-radius:50px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 70%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
  .nav-actions{display:flex;gap:8px}
  .icon-btn,.back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--fill-2);border:1px solid var(--glass-border);color:var(--label);border-radius:50px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .25s var(--spring),background .2s}
  .icon-btn:hover,.back-btn:hover{background:var(--fill);transform:scale(1.05)}
  .icon-btn:active,.back-btn:active{transform:scale(.93)}
  .back-btn .chev{font-size:20px;line-height:1;color:var(--blue)}
  .icon-btn{width:40px;height:40px;padding:0;justify-content:center}
  .icon-btn.spinning svg{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .theme-btn .sun{display:none}
  [data-theme="light"] .theme-btn .sun{display:block}
  [data-theme="light"] .theme-btn .moon{display:none}

  /* Layout */
  .grid{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
  .sidebar{padding:18px;position:sticky;top:90px;max-height:calc(100vh - 112px);max-height:calc(100dvh - 112px);overflow-y:auto}
  .main{min-height:60vh;min-width:0}
  .side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px}
  .side-head h3{font-size:15px;font-weight:700}
  .count-badge{font-size:12px;font-weight:700;color:var(--blue);background:color-mix(in srgb,var(--blue) 15%,transparent);padding:3px 10px;border-radius:20px}
  .search{display:flex;align-items:center;gap:8px;background:var(--search);border-radius:12px;padding:9px 12px;margin-bottom:14px}
  .search svg{flex-shrink:0;opacity:.5}
  .search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--label);font-size:14px;font-family:inherit}
  .search input::placeholder{color:var(--label-3)}

  .user-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:18px;margin-bottom:6px;background:transparent;border:1px solid transparent;cursor:pointer;transition:background .2s,transform .25s var(--spring);text-align:right;color:var(--label)}
  .user-item:hover{background:var(--fill)}
  .user-item:active{transform:scale(.98)}
  .user-item.active{background:color-mix(in srgb,var(--blue) 16%,transparent);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
  .avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px rgba(0,0,0,.25)}
  .avatar.xl{width:62px;height:62px;font-size:24px}
  .u-info{flex:1;min-width:0}
  .u-name{display:block;font-weight:600;font-size:14.5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .u-stats{display:block;font-size:12px;color:var(--label-2)}
  .u-chev{color:var(--label-3);font-size:22px;line-height:1}

  .profile-card{display:flex;align-items:center;gap:18px;padding:24px;margin-bottom:16px}
  .p-info{flex:1;min-width:0}
  .p-name{font-size:24px;font-weight:800;margin-bottom:4px}
  .p-sub{font-size:13px;color:var(--label-2)}
  .ring{position:relative;width:88px;height:88px;border-radius:50%;margin:0 auto;background:conic-gradient(var(--green) var(--deg),var(--fill-2) 0);display:grid;place-items:center;transition:--deg 1.4s var(--spring)}
  .ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--ring-in);border:1px solid var(--separator)}
  .ring span{position:relative;z-index:1;font-size:16px;font-weight:800;color:var(--green)}
  .ring-lbl{text-align:center;font-size:11px;color:var(--label-2);margin-top:6px}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--glass);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-border);border-radius:22px;padding:16px;box-shadow:var(--hi);transition:transform .3s var(--spring)}
  .kpi:hover{transform:translateY(-3px)}
  .kpi .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px;margin-bottom:12px;background:color-mix(in srgb,var(--c) 18%,transparent)}
  .kpi .v{font-size:27px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
  .kpi .l{font-size:12px;color:var(--label-2);margin-top:2px}
  .kpi.blue{--c:var(--blue)} .kpi.green{--c:var(--green)} .kpi.red{--c:var(--red)} .kpi.orange{--c:var(--orange)} .kpi.purple{--c:var(--purple)}

  .summary{display:flex;gap:12px;padding:16px 18px;border-radius:var(--r-md);margin-bottom:16px;font-size:13.5px;line-height:1.9;color:var(--label-2)}
  .summary .spark{font-size:18px}

  /* Segmented control با تیغه متحرک */
  .segmented{position:relative;display:flex;background:var(--seg);border-radius:14px;padding:3px;margin-bottom:18px}
  .segmented::before{content:"";position:absolute;top:3px;bottom:3px;right:3px;width:calc((100% - 6px) / 3);border-radius:11px;background:var(--seg-thumb);box-shadow:0 3px 10px rgba(0,0,0,.2);transform:translateX(calc(var(--i,0) * -100%));transition:transform .45s var(--spring)}
  .segmented button{position:relative;z-index:1;flex:1;padding:9px;border:none;background:transparent;color:var(--label-2);font-weight:600;font-size:13.5px;cursor:pointer;transition:color .25s}
  .segmented button.active{color:var(--label)}

  .tab-section{display:none}
  .tab-section.show{display:block;animation:fadeUp .45s var(--spring) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .enter{animation:fadeUp .55s var(--spring) both}

  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .chart-box{padding:18px;height:330px;border-radius:var(--r-md);display:flex;flex-direction:column}
  .chart-box h4{font-size:13px;color:var(--label-2);margin-bottom:12px;text-align:center;font-weight:600}
  .chart-box .cv{position:relative;flex:1;min-height:0}
  .chart-wide{grid-column:1 / -1;height:310px}
  .no-data{margin:auto;color:var(--label-3);font-size:13px}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:8px 16px;border-radius:50px;background:var(--fill);border:1px solid var(--separator);color:var(--label-2);font-size:12.5px;font-weight:600;cursor:pointer;transition:transform .25s var(--spring),background .2s}
  .chip:active{transform:scale(.94)}
  .chip.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--blue) 40%,transparent)}

  .file-list{border-radius:var(--r-md);overflow:hidden}
  .file-row{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--separator);transition:background .15s}
  .file-row:last-child{border-bottom:none}
  .file-row:hover{background:var(--fill)}
  .file-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex-shrink:0;background:var(--fill-2)}
  .file-info{flex:1;min-width:0}
  .file-name{font-weight:600;font-size:14px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
  .file-meta{font-size:12px;color:var(--label-2);margin-bottom:7px}
  .file-badges{display:flex;gap:6px;flex-wrap:wrap}
  .pill{padding:3px 11px;border-radius:50px;font-size:11px;font-weight:700}
  .pill.rel,.pill.t-low{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
  .pill.unrel,.pill.t-high,.pill.t-critical{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
  .pill.t-medium{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
  .pill.t-unknown{background:var(--fill-2);color:var(--label-2)}
  .file-score{text-align:center;flex-shrink:0;width:74px}
  .score-val{font-weight:800;font-size:15px;color:var(--teal)}
  .score-bar{height:4px;border-radius:4px;background:var(--fill-2);margin:6px 0 4px;overflow:hidden}
  .score-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--blue));width:0;transition:width 1s var(--spring)}
  .score-lbl{font-size:10px;color:var(--label-3)}

  .empty-state{text-align:center;padding:70px 24px;color:var(--label-2)}
  .empty-state .big{font-size:52px;margin-bottom:16px;display:block}
  .empty-state h3{font-size:18px;color:var(--label);margin-bottom:8px;font-weight:700}
  .spinner{width:30px;height:30px;border:3px solid var(--fill-2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}

  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:10px}

  /* ── Chat messages ──────────────────────────────────── */
  .chat-msg{display:flex;gap:10px;margin-bottom:12px;animation:fadeUp .3s ease both}
  .chat-msg .bubble{
    max-width:78%;padding:11px 14px;border-radius:16px;font-size:13.5px;
    line-height:1.85;white-space:pre-wrap;word-break:break-word;
  }
  .chat-msg.user{justify-content:flex-start;flex-direction:row-reverse}
  .chat-msg.user .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  .chat-msg.assistant .bubble{background:var(--fill-2);color:var(--label);border-bottom-left-radius:4px}
  .chat-msg .avatar-sm{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;font-size:14px;
    background:var(--fill-2);border:1px solid var(--separator)
  }
  .chat-typing{display:inline-flex;gap:4px;padding:8px 12px}
  .chat-typing i{width:6px;height:6px;border-radius:50%;background:var(--label-3);animation:blink 1.2s infinite}
  .chat-typing i:nth-child(2){animation-delay:.2s}
  .chat-typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  @media (max-width:960px){
    body{padding:12px}
    .grid{grid-template-columns:1fr}
    .sidebar{position:static;max-height:340px}
    .charts-grid{grid-template-columns:1fr}
    .profile-card{flex-wrap:wrap}
    .live span{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<nav class="navbar glass">
  <a href="/ai-settings/" class="back-btn"><span class="chev">›</span> بازگشت</a>
  <div class="nav-title">گزارشات هوش مصنوعی <span class="live" title="به‌روزرسانی خودکار هر ۳۰ ثانیه"><i></i><span>زنده</span></span></div>
  <div class="nav-actions">
    <button class="icon-btn theme-btn" id="themeBtn" title="تغییر تم" aria-label="تغییر تم">
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="refreshBtn" title="بازخوانی" aria-label="بازخوانی">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
    </button>
  </div>
</nav>

<div class="grid">
  <aside class="sidebar glass">
    <div class="side-head"><h3>کاربران</h3><span class="count-badge" id="userCount">۰</span></div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="searchInput" placeholder="جستجوی کاربر...">
    </div>
    <div id="usersList"><div class="spinner"></div></div>
  </aside>

  <main class="main" id="mainArea">
    <div class="glass" style="padding:40px">
      <div class="empty-state" style="padding:20px">
        <span class="big">📊</span>
        <h3>گزارشات هوش مصنوعی</h3>
        برای مشاهده تحلیل رفتار، یک کاربر را از لیست انتخاب کنید
      </div>
    </div>
  </main>
</div>

<script>
  /* ── CSRF ── */
  function getCsrfToken(){
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }
  const csrftoken = getCsrfToken();

  /* ── State ── */
  let charts = {};
  let currentUserId = null, currentTab = 'overview', currentFilter = 'all';
  let usersCache = [], lastSig = '', lastData = null, reqSeq = 0, usersSig = '';

  /* ── Helpers ── */
  const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  function escapeHtml(s){
    if(s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  const fmtTime = s => s ? escapeHtml(String(s).replace('T',' ').slice(0,16)) : '—';
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const hexA = (hex, a) => {
    const h = hex.replace('#',''); const n = parseInt(h.length===3 ? h.replace(/./g,'$&$&') : h, 16);
    return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
  };
  const AVATAR_GRADS = [
    'linear-gradient(135deg,#0A84FF,#5E5CE6)','linear-gradient(135deg,#30D158,#64D2FF)',
    'linear-gradient(135deg,#FF9F0A,#FF375F)','linear-gradient(135deg,#BF5AF2,#FF375F)',
    'linear-gradient(135deg,#64D2FF,#0A84FF)','linear-gradient(135deg,#FF453A,#FF9F0A)'
  ];
  const avatarBg = id => AVATAR_GRADS[Math.abs(num(id)) % AVATAR_GRADS.length];
  const initial = n => escapeHtml((n||'?').trim().charAt(0).toUpperCase());

  const THREAT = {
    low:{t:'تهدید: کم',c:'t-low'}, medium:{t:'تهدید: متوسط',c:'t-medium'},
    high:{t:'تهدید: بالا',c:'t-high'}, critical:{t:'تهدید: بحرانی',c:'t-critical'}
  };
  const threatPill = lvl => {
    const m = THREAT[String(lvl||'').toLowerCase()] || {t:escapeHtml(lvl||'—'),c:'t-unknown'};
    return `<span class="pill ${m.c}">${m.t}</span>`;
  };

  async function getJSON(url){
    const r = await fetch(url, {headers:{'Accept':'application/json'}, credentials:'same-origin'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  /* شمارنده متحرک اعداد */
  function countUp(el){
    const end = parseFloat(el.dataset.count), dec = parseInt(el.dataset.dec || 0), t0 = performance.now(), dur = 1100;
    const fmt = v => dec ? toFa(v.toFixed(dec)) : toFa(Math.round(v));
    (function tick(t){
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = fmt(end * e);
      if(p < 1) requestAnimationFrame(tick);
    })(t0);
  }

  /* ── Theme ── */
  function applyThemeMeta(){
    document.getElementById('themeColor').content = document.documentElement.dataset.theme === 'light' ? '#F2F2F7' : '#000000';
  }
  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    const swap = () => {
      document.documentElement.dataset.theme = next;
      try{ localStorage.setItem('theme', next); }catch(e){}
      applyThemeMeta();
      if(lastData && document.getElementById('chartTopics')) buildCharts(lastData);
    };
    document.startViewTransition ? document.startViewTransition(swap) : swap();
  });
  applyThemeMeta();

  /* ── Chart.js setup ── */
  Chart.defaults.font.family = "'Vazirmatn',-apple-system,'SF Pro Text',sans-serif";
  const PALETTE = () => [css('--blue'),css('--green'),css('--orange'),css('--red'),css('--purple'),css('--teal'),css('--indigo'),css('--pink')];

  const tooltip = () => ({
    backgroundColor:css('--tip'), borderColor:css('--separator'), borderWidth:1,
    titleColor:css('--label'), bodyColor:css('--label-2'), padding:12, cornerRadius:12,
    displayColors:false, rtl:true, textDirection:'rtl', titleFont:{weight:'700'}, bodyFont:{size:12},
    callbacks:{ label: c => toFa(c.formattedValue) }
  });

  const vGrad = (hex, a0=1, a1=.55) => ctx => {
    const a = ctx.chart.chartArea; if(!a) return hex;
    const g = ctx.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
    g.addColorStop(0, hexA(hex, a0)); g.addColorStop(1, hexA(hex, a1));
    return g;
  };

  /* متن وسط نمودار دونات */
  const centerText = {
    id:'centerText',
    afterDraw(c, _, o){
      if(c.config.type !== 'doughnut' || !o.text) return;
      const {ctx, chartArea:a} = c, x = (a.left+a.right)/2, y = (a.top+a.bottom)/2;
      ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = css('--label'); ctx.font = '800 26px Vazirmatn, sans-serif'; ctx.fillText(o.text, x, y - 8);
      ctx.fillStyle = css('--label-2'); ctx.font = '500 11px Vazirmatn, sans-serif'; ctx.fillText(o.sub, x, y + 16);
      ctx.restore();
    }
  };

  function destroyCharts(){ Object.values(charts).forEach(c => c && c.destroy()); charts = {}; }

  function buildCharts(d){
    destroyCharts();
    const b = d.behavior, topics = b.top_topics || [], trend = d.trend || [];
    const txt = css('--label-2'), grid = css('--separator'), P = PALETTE();
    const base = {responsive:true, maintainAspectRatio:false};
    const scaleY = {beginAtZero:true, grid:{color:grid}, border:{display:false}, ticks:{precision:0, color:txt, callback:v => toFa(v)}};

    /* دونات: چرخش + بزرگ‌شدن */
    const cT = document.getElementById('chartTopics');
    if(cT){
      const total = topics.reduce((s,t) => s + num(t.count), 0);
      charts.topics = new Chart(cT, {
        type:'doughnut',
        data:{ labels:topics.map(t => t.name),
          datasets:[{ data:topics.map(t => num(t.count)), backgroundColor:topics.map((_,i) => P[i % P.length]),
            borderWidth:0, hoverOffset:12, spacing:3, borderRadius:8 }] },
        options:{ ...base, cutout:'68%',
          animation:{ animateRotate:true, animateScale:true, duration:1600, easing:'easeOutQuart' },
          plugins:{ centerText:{text:toFa(total), sub:'مجموع'}, tooltip:tooltip(),
            legend:{position:'bottom', labels:{usePointStyle:true, pointStyle:'circle', boxWidth:8, padding:14, color:txt, font:{size:11}}} } },
        plugins:[centerText]
      });
    }

    /* میله‌ای: رشد با تأخیر پله‌ای */
    charts.related = new Chart(document.getElementById('chartRelated'), {
      type:'bar',
      data:{ labels:['مرتبط','غیرمرتبط'],
        datasets:[{ data:[num(b.related_files_count), num(b.unrelated_files_count)],
          backgroundColor:[vGrad(css('--green')), vGrad(css('--red'))],
          borderRadius:14, borderSkipped:false, categoryPercentage:.6, barPercentage:.75 }] },
      options:{ ...base,
        animation:{ duration:1400, easing:'easeOutElastic', delay:c => c.type==='data' && c.mode==='default' ? c.dataIndex*220 : 0 },
        plugins:{ legend:{display:false}, tooltip:tooltip() },
        scales:{ x:{grid:{display:false}, border:{display:false}, ticks:{color:css('--label'), font:{size:13, weight:'600'}}}, y:scaleY } }
    });

    /* خطی: نقاط یکی‌یکی از پایین بالا می‌آیند */
    const n = trend.length || 1;
    const blue = css('--blue');
    charts.trend = new Chart(document.getElementById('chartTrend'), {
      type:'line',
      data:{ labels:trend.map(t => t.date),
        datasets:[{ label:'تعداد آپلود', data:trend.map(t => num(t.count)), borderColor:blue, borderWidth:3, fill:true,
          backgroundColor:vGrad(blue, .4, 0), tension:.42, pointRadius:0, pointHoverRadius:7,
          pointBackgroundColor:blue, pointBorderColor:'#fff', pointBorderWidth:2 }] },
      options:{ ...base, interaction:{mode:'index', intersect:false},
        animations:{ y:{ easing:'easeOutQuart', duration:900,
          from:c => c.chart.scales.y.getPixelForValue(0),
          delay:c => c.type==='data' && c.mode==='default' ? c.dataIndex*(1400/n) : 0 } },
        plugins:{ legend:{display:false}, tooltip:tooltip() },
        scales:{ x:{grid:{display:false}, border:{display:false}, ticks:{color:txt, maxTicksLimit:8}}, y:scaleY } }
    });
  }

  /* ── Users sidebar ── */
  async function loadUsers(){
    const list = document.getElementById('usersList');
    if(!usersCache.length) list.innerHTML = '<div class="spinner"></div>';
    try{
      const d = await getJSON('/api/behavior-analysis/');
      if(!d.success || !d.items || !d.items.length){
        usersCache = [];
        list.innerHTML = '<div class="empty-state" style="padding:40px 10px"><span class="big">🫥</span>هیچ کاربری تحلیل نشده</div>';
        document.getElementById('userCount').textContent = '۰';
        return;
      }
      const sig = JSON.stringify(d.items);
      if(sig === usersSig) return;
      usersSig = sig; usersCache = d.items;
      document.getElementById('userCount').textContent = toFa(d.items.length);
      filterUsers();
    }catch(e){
      if(!usersCache.length) list.innerHTML = '<div class="empty-state" style="padding:40px 10px"><span class="big">⚠️</span>خطا در بارگذاری</div>';
    }
  }

  function renderUserList(items){
    const list = document.getElementById('usersList');
    if(!items.length){ list.innerHTML = '<div class="empty-state" style="padding:40px 10px"><span class="big">🔍</span>موردی پیدا نشد</div>'; return; }
    list.innerHTML = items.map(u => `
      <button class="user-item ${u.user_id===currentUserId?'active':''}" data-uid="${u.user_id}">
        <span class="avatar" style="background:${avatarBg(u.user_id)}">${initial(u.username)}</span>
        <span class="u-info">
          <span class="u-name">${escapeHtml(u.username)}</span>
          <span class="u-stats">${toFa(num(u.total_files))} فایل · ${toFa(num(u.related_percent))}٪ مرتبط · ${toFa(num(u.suspicious_count))} مشکوک</span>
        </span>
        <span class="u-chev">‹</span>
      </button>`).join('');
  }
  function filterUsers(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    renderUserList(usersCache.filter(u => (u.username||'').toLowerCase().includes(q)));
  }
  /* event delegation: بدون اتصال دوباره listener */
  document.getElementById('usersList').addEventListener('click', e => {
    const el = e.target.closest('.user-item'); if(!el) return;
    currentTab = 'overview'; currentFilter = 'all';
    loadUser(parseInt(el.dataset.uid, 10));
  });
  document.getElementById('searchInput').addEventListener('input', filterUsers);

  document.getElementById('refreshBtn').addEventListener('click', function(){
    this.classList.add('spinning'); setTimeout(() => this.classList.remove('spinning'), 800);
    usersSig = ''; loadUsers();
    if(currentUserId) loadUser(currentUserId, true, true);
  });

  /* ── User detail ── */
  async function loadUser(userId, silent, force){
    const seq = ++reqSeq;                      // جلوگیری از رِیس بین درخواست‌ها
    const changed = userId !== currentUserId;
    currentUserId = userId;
    document.querySelectorAll('.user-item').forEach(el =>
      el.classList.toggle('active', parseInt(el.dataset.uid, 10) === userId));
    const main = document.getElementById('mainArea');
    if(!silent || changed){ main.innerHTML = '<div class="spinner"></div>'; lastSig = ''; }

    try{
      const d = await getJSON(`/api/behavior-analysis/${userId}/`);
      if(seq !== reqSeq) return;               // پاسخ کهنه
      if(!d.success){
        main.innerHTML = `<div class="glass"><div class="empty-state"><span class="big">⚠️</span>${escapeHtml(d.msg||'خطا')}</div></div>`;
        return;
      }
      const sig = JSON.stringify(d);
      if(!force && sig === lastSig) return;
      if(silent && !force && currentTab === 'chat'){ return; }  // گفتگو با رندر خودکار پاک نشود    // داده تغییری نکرده
      lastSig = sig;
      renderUser(d);
    }catch(e){
      if(seq !== reqSeq) return;
      if(!silent) main.innerHTML = '<div class="glass"><div class="empty-state"><span class="big">📡</span>خطا در ارتباط با سرور</div></div>';
    }
  }

  function setTab(name){
    currentTab = name;
    const btns = [...document.querySelectorAll('#segTabs button')];
    btns.forEach((x, i) => { x.classList.toggle('active', x.dataset.tab === name); if(x.dataset.tab === name) document.getElementById('segTabs').style.setProperty('--i', i); });
    document.querySelectorAll('.tab-section').forEach(s => s.classList.toggle('show', s.id === 'tab-' + name));
    if(name === 'overview') Object.values(charts).forEach(c => c && c.resize());
    if(name === 'files') requestAnimationFrame(() => document.querySelectorAll('.score-bar i').forEach(i => i.style.width = i.dataset.w + '%'));
  }

  function applyFilter(f){
    currentFilter = f;
    document.querySelectorAll('#filterChips .chip').forEach(c => c.classList.toggle('active', c.dataset.f === f));
    document.querySelectorAll('#fileList .file-row').forEach(row => {
      const rel = row.dataset.rel === '1', susp = row.dataset.susp === '1';
      row.style.display = (f==='all' || (f==='related'&&rel) || (f==='unrelated'&&!rel) || (f==='suspicious'&&susp)) ? '' : 'none';
    });
  }

  function renderUser(d){
    lastData = d;
    const b = d.behavior || {}, files = d.files || [], user = d.user || {};
    const total = num(b.total_files), rel = num(b.related_files_count);
    const relatedPct = total > 0 ? Math.round(rel / total * 100) : 0;

    const kpis = [
      {cls:'blue',   ic:'📁', v:total,                     l:'کل فایل‌ها'},
      {cls:'green',  ic:'✅', v:rel,                       l:'مرتبط'},
      {cls:'red',    ic:'🚫', v:num(b.unrelated_files_count),  l:'غیرمرتبط'},
      {cls:'orange', ic:'⚠️', v:num(b.suspicious_files_count), l:'مشکوک'},
      {cls:'purple', ic:'📈', v:num(b.relevance_avg), dec:2, l:'میانگین relevance'},
    ].map((k,i) => `
      <div class="kpi enter ${k.cls}" style="animation-delay:${.06*i}s">
        <div class="ic">${k.ic}</div>
        <div class="v" data-count="${k.v}" data-dec="${k.dec||0}">${toFa(k.v)}</div>
        <div class="l">${k.l}</div>
      </div>`).join('');

    const filesHtml = files.length === 0
      ? '<div class="empty-state"><span class="big">🗂️</span>هیچ فایلی تحلیل نشده</div>'
      : `<div class="chips" id="filterChips">
           <button class="chip" data-f="all">همه</button>
           <button class="chip" data-f="related">مرتبط</button>
           <button class="chip" data-f="unrelated">غیرمرتبط</button>
           <button class="chip" data-f="suspicious">مشکوک</button>
         </div>
         <div class="file-list glass" id="fileList">
          ${files.map(f => {
            const susp = ['high','critical'].includes(String(f.threat_level||'').toLowerCase());
            const sc = num(f.relevance_score);
            return `
            <div class="file-row" data-rel="${f.is_related?1:0}" data-susp="${susp?1:0}">
              <div class="file-icon">📄</div>
              <div class="file-info">
                <div class="file-name">${escapeHtml(f.file_name)}</div>
                <div class="file-meta">${escapeHtml(f.top_topic||'—')} · ${escapeHtml(f.category||'—')} · ${fmtTime(f.analyzed_at)}</div>
                <div class="file-badges">
                  <span class="pill ${f.is_related?'rel':'unrel'}">${f.is_related?'مرتبط':'غیرمرتبط'}</span>
                  ${threatPill(f.threat_level)}
                </div>
              </div>
              <div class="file-score">
                <div class="score-val">${toFa(sc.toFixed(2))}</div>
                <div class="score-bar"><i data-w="${Math.max(0,Math.min(100,sc*100))}"></i></div>
                <div class="score-lbl">relevance</div>
              </div>
            </div>`;}).join('')}
         </div>`;

    destroyCharts();
    const hasTopics = (b.top_topics || []).length > 0;
    document.getElementById('mainArea').innerHTML = `
      <div class="profile-card glass enter">
        <span class="avatar xl" style="background:${avatarBg(user.id ?? currentUserId)}">${initial(user.username)}</span>
        <div class="p-info">
          <div class="p-name">${escapeHtml(user.username)}</div>
          <div class="p-sub">گزارش تحلیل رفتار مبتنی بر هوش مصنوعی</div>
        </div>
        <div>
          <div class="ring" id="relRing"><span>${toFa(relatedPct)}٪</span></div>
          <div class="ring-lbl">آپلود مرتبط</div>
        </div>
      </div>

      <div class="kpi-grid">${kpis}</div>

      ${b.ai_summary ? `<div class="summary glass enter"><span class="spark">✨</span><span>${escapeHtml(b.ai_summary)}</span></div>` : ''}

      <div class="segmented enter" id="segTabs">
        <button data-tab="overview">نمای کلی</button>
        <button data-tab="files">فایل‌ها</button>
        <button data-tab="chat">💬 چت با AI</button>
      </div>

      <div class="tab-section" id="tab-overview">
        <div class="charts-grid">
          <div class="chart-box glass"><h4>🍩 موضوعات غالب</h4>
            <div class="cv">${hasTopics ? '<canvas id="chartTopics"></canvas>' : '<div class="no-data" style="position:absolute;inset:0;display:grid;place-items:center">داده‌ای برای نمایش نیست</div>'}</div></div>
          <div class="chart-box glass"><h4>📊 مرتبط / غیرمرتبط</h4>
            <div class="cv"><canvas id="chartRelated"></canvas></div></div>
          <div class="chart-box glass chart-wide"><h4>📈 روند آپلود (۳۰ روز اخیر)</h4>
            <div class="cv"><canvas id="chartTrend"></canvas></div></div>
        </div>
      </div>

      <div class="tab-section" id="tab-files">${filesHtml}</div>

      <div class="tab-section" id="tab-chat">
        <div class="chat-container glass" style="border-radius:var(--r-md);padding:18px;margin-top:8px">
          <div class="chat-toolbar" style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
            <button class="icon-btn" id="chatNewSession" title="جلسه جدید" style="width:auto;padding:8px 14px;font-size:13px">➕ جلسه جدید</button>
            <span id="chatStatus" style="font-size:12px;color:var(--label-2)">آماده</span>
          </div>
          <div id="chatMessages" class="chat-messages" style="min-height:200px;max-height:420px;overflow-y:auto;padding:8px;background:var(--fill);border-radius:14px;margin-bottom:12px">
            <div class="empty-state" style="padding:30px 20px">
              <span class="big">💬</span>
              <h3>چت با هوش مصنوعی</h3>
              برای شروع، روی «جلسه جدید» بزنید تا روی فایل‌های همین کاربر گفتگو کنید
            </div>
          </div>
          <div class="chat-input-row" style="display:flex;gap:8px">
            <input type="text" id="chatInput" placeholder="سوال خود را بنویسید..." disabled
                   style="flex:1;min-width:0;background:var(--search);border:none;outline:none;color:var(--label);font-size:14px;font-family:inherit;padding:11px 14px;border-radius:12px">
            <button class="icon-btn" id="chatSend" disabled
                    style="width:auto;padding:11px 20px;font-size:13px;font-weight:600">ارسال</button>
          </div>
        </div>
      </div>
    `;

    requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('relRing').style.setProperty('--deg', relatedPct + '%')));
    document.querySelectorAll('.kpi .v').forEach(countUp);

    document.querySelectorAll('#segTabs button').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));
    document.querySelectorAll('#filterChips .chip').forEach(chip => chip.addEventListener('click', () => applyFilter(chip.dataset.f)));
    applyFilter(currentFilter);
    setTab(currentTab);
    buildCharts(d);

    const chatFiles = files.map(f => f.file_id).filter(Boolean);
    chatBind(chatFiles, d.user.id);
  }

  /* ── Live: به‌روزرسانی خودکار هر ۳۰ ثانیه (فقط وقتی تب فعال است) ── */
  setInterval(() => {
    if(document.hidden) return;
    loadUsers();
    if(currentUserId) loadUser(currentUserId, true);
  }, 30000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden && currentUserId) loadUser(currentUserId, true); });

  /* ══════════════════════════════════════════════════════
     Report Chat — چت با AI روی فایل‌های کاربر
     ══════════════════════════════════════════════════════ */
  const chatState = { sessionId: null, sending: false, filesForChat: [], targetUserId: null };

  const chatEl = (id) => document.getElementById(id);

  function chatSetEnabled(enabled){
    const input = chatEl('chatInput'), send = chatEl('chatSend');
    if(input) input.disabled = !enabled;
    if(send) send.disabled = !enabled || chatState.sending;
  }

  function chatAppend(role, content){
    const wrap = chatEl('chatMessages');
    if(!wrap) return null;
    const empty = wrap.querySelector('.empty-state');
    if(empty) empty.remove();
    const div = document.createElement('div');
    div.className = `chat-msg ${role}`;
    div.innerHTML = `
      <div class="avatar-sm">${role === 'user' ? '👤' : '🤖'}</div>
      <div class="bubble">${escapeHtml(content)}</div>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return div;
  }

  function chatShowTyping(){
    const wrap = chatEl('chatMessages');
    if(!wrap) return null;
    const div = document.createElement('div');
    div.className = 'chat-msg assistant';
    div.id = 'chatTyping';
    div.innerHTML = `
      <div class="avatar-sm">🤖</div>
      <div class="bubble chat-typing"><i></i><i></i><i></i></div>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return div;
  }

  async function chatStartSession(){
    const btn = chatEl('chatNewSession'), status = chatEl('chatStatus');
    if(!btn) return;
    btn.disabled = true;
    if(status) status.textContent = ' در حال ساخت جلسه...';

    try{
      const r = await fetch('/api/report-chat/start/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
        body: JSON.stringify({
          file_ids: chatState.filesForChat,
          target_user_id: chatState.targetUserId,
          title: `چت روی ${chatState.filesForChat.length} فایل`,
        }),
      });
      const d = await r.json();
      if(!d.success){
        if(status) status.textContent = ' ' + (d.msg || 'خطا');
        return;
      }
      chatState.sessionId = d.session_id;
      if(status) status.textContent = ` جلسه #${d.session_id} — ${d.file_count} فایل`;
      const wrap = chatEl('chatMessages');
      if(wrap) wrap.innerHTML = '';
      chatSetEnabled(true);
      chatEl('chatInput')?.focus();
    }catch(e){
      if(status) status.textContent = ' خطای شبکه';
    }finally{
      btn.disabled = false;
    }
  }

  async function chatSendMessage(){
    if(chatState.sending) return;
    const input = chatEl('chatInput'), status = chatEl('chatStatus');
    const q = (input?.value || '').trim();
    if(!q) return;

    if(!chatState.sessionId){
      await chatStartSession();
      if(!chatState.sessionId) return;
    }

    chatState.sending = true;
    if(input) input.value = '';
    chatAppend('user', q);
    chatSetEnabled(false);
    const typing = chatShowTyping();
    if(status) status.textContent = '⏳ در حال پاسخ...';

    try{
      const r = await fetch(`/api/report-chat/${chatState.sessionId}/ask/`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
        body: JSON.stringify({question: q}),
      });
      const d = await r.json();
      if(typing) typing.remove();
      if(d.success){
        chatAppend('assistant', d.answer);
        if(status) status.textContent = ' آماده';
      }else{
        chatAppend('assistant', ' ' + (d.msg || 'خطا در دریافت پاسخ'));
        if(status) status.textContent = ' خطا';
      }
    }catch(e){
      if(typing) typing.remove();
      chatAppend('assistant', ' خطای شبکه');
      if(status) status.textContent = ' خطای شبکه';
    }finally{
      chatState.sending = false;
      chatSetEnabled(true);
      chatEl('chatInput')?.focus();
    }
  }

  function chatBind(files, targetUserId){
    chatState.sessionId = null;
    chatState.filesForChat = files || [];
    chatState.targetUserId = targetUserId;
    chatSetEnabled(false);

    const newBtn = chatEl('chatNewSession');
    if(!newBtn) return;
    newBtn.onclick = chatStartSession;
    chatEl('chatSend').onclick = chatSendMessage;
    chatEl('chatInput').onkeydown = (e) => {
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); chatSendMessage(); }
    };
    const wrap = chatEl('chatMessages');
    if(wrap){
      wrap.innerHTML = `
        <div class="empty-state" style="padding:30px 20px">
          <span class="big">💬</span>
          <h3>چت با هوش مصنوعی</h3>
          برای شروع، روی «جلسه جدید» بزنید تا روی فایل‌های همین کاربر گفتگو کنید
        </div>`;
    }
    const status = chatEl('chatStatus');
    if(status) status.textContent = `آماده (${chatState.filesForChat.length} فایل)`;
  }

  loadUsers();
</script>
</body>
</html>
