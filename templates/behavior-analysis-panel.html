{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090B" id="themeColor">
<title>گزارشات هوش مصنوعی — داشبورد تحلیل</title>

<script>
  (function(){
    var t; try{ t = localStorage.getItem('theme'); }catch(e){}
    if(!t) t = 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
<script src="{% static 'vendor/chartjs/chart.umd.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'vendor/vazirmatn/vazirmatn.css' %}">

<style>
  /* ═══════ Tokens ═══════ */
  :root, [data-theme="dark"]{
    color-scheme: dark;
    --bg:#09090B; --bg-1:#0E0E11; --bg-2:#18181B; --bg-3:#212126; --bg-4:#2A2A31;
    --line:#26262B; --line-2:#35353C; --line-3:#4A4A54;
    --fg:#FAFAFA; --fg-2:#A1A1AA; --fg-3:#71717A; --fg-4:#52525B;
    --brand:#6366F1; --brand-hover:#818CF8; --brand-soft:#6366F114; --brand-line:#6366F140;
    --success:#10B981; --success-soft:#10B98114;
    --warning:#F59E0B; --warning-soft:#F59E0B14;
    --danger:#EF4444; --danger-soft:#EF444414;
    --info:#3B82F6; --info-soft:#3B82F614;
    --tip:#18181B; --separator:#26262B; --label:#FAFAFA; --label-2:#A1A1AA;
    --focus:0 0 0 3px #6366F140; --ring:0 0 0 1px #35353C;
    --ease:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
    --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
  }
  [data-theme="light"]{
    color-scheme: light;
    --bg:#FAFAFA; --bg-1:#FFFFFF; --bg-2:#F4F4F5; --bg-3:#EBEBEE; --bg-4:#E1E1E5;
    --line:#E4E4E7; --line-2:#D4D4D8; --line-3:#B8B8BF;
    --fg:#18181B; --fg-2:#52525B; --fg-3:#71717A; --fg-4:#A1A1AA;
    --brand:#4F46E5; --brand-hover:#4338CA; --brand-soft:#4F46E510; --brand-line:#4F46E530;
    --success:#059669; --success-soft:#05966910;
    --warning:#D97706; --warning-soft:#D9770610;
    --danger:#DC2626; --danger-soft:#DC262610;
    --info:#2563EB; --info-soft:#2563EB10;
    --tip:#FFFFFF; --separator:#E4E4E7; --label:#18181B; --label-2:#52525B;
    --focus:0 0 0 3px #4F46E530; --ring:0 0 0 1px #D4D4D8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--fg);
    font-size: 14px; line-height: 1.65;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  input, select { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }
  ::selection { background: var(--brand-soft); color: var(--fg); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-3); }

  /* Layout */
  .app {
    display: grid;
    grid-template-columns: 264px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas: "top top" "side main";
    height: 100vh; height: 100dvh;
    transition: grid-template-columns .25s var(--ease);
  }
  .app.collapsed { grid-template-columns: 64px 1fr; }

  /* Topbar */
  .top {
    grid-area: top;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: var(--bg-1);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 50;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 13px;
    white-space: nowrap; text-decoration: none;
    color: var(--fg); letter-spacing: -.01em;
  }
  .brand-logo {
    width: 26px; height: 26px; border-radius: var(--r-sm);
    background: var(--brand);
    display: grid; place-items: center;
    color: #fff; font-size: 11px; font-weight: 700;
  }
  .hr-v { width: 1px; height: 18px; background: var(--line); }
  .crumbs {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--fg-3);
  }
  .crumbs a { color: var(--fg-3); text-decoration: none; transition: color .15s; }
  .crumbs a:hover { color: var(--fg); }
  .crumbs .cur { color: var(--fg); font-weight: 500; }
  .top-right { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px; border-radius: var(--r-sm);
    font-size: 11px; font-weight: 500;
    background: var(--success-soft); color: var(--success);
    border: 1px solid color-mix(in srgb, var(--success) 25%, transparent);
  }
  .live .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--success); position: relative;
  }
  .live .dot::after {
    content: ''; position: absolute; inset: -3px;
    border-radius: 50%; background: var(--success);
    animation: ping 2s cubic-bezier(0,0,.2,1) infinite;
  }
  @keyframes ping { 75%,100% { transform: scale(2.2); opacity: 0; } }
  .ico-btn {
    width: 30px; height: 30px; border-radius: var(--r-sm);
    display: inline-grid; place-items: center;
    color: var(--fg-2);
    transition: background .15s, color .15s;
  }
  .ico-btn:hover { background: var(--bg-3); color: var(--fg); }
  .ico-btn.spinning svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .theme-btn .sun { display: none; }
  [data-theme="light"] .theme-btn .sun { display: block; }
  [data-theme="light"] .theme-btn .moon { display: none; }

  .who {
    display: none; align-items: center; gap: 8px;
    padding: 3px 10px 3px 3px; border-radius: var(--r-sm);
    background: var(--bg-2); border: 1px solid var(--line);
    margin-inline-end: 6px;
  }
  .who.on { display: inline-flex; }
  .who .ava { width: 24px; height: 24px; font-size: 10px; }
  .who .nm {
    font-size: 12px; font-weight: 500;
    max-width: 140px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }

  /* Sidebar */
  .side {
    grid-area: side; background: var(--bg-1);
    border-inline-end: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }
  .side-hd {
    padding: 14px 14px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .side-title {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    color: var(--fg-3); text-transform: uppercase; white-space: nowrap;
  }
  .side-count {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: var(--r-sm);
    background: var(--bg-3); color: var(--fg-2);
    border: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .search-box { padding: 0 10px 12px; }
  .search-box label {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 7px 10px;
    cursor: text; transition: all .15s var(--ease);
  }
  .search-box label:focus-within {
    border-color: var(--brand); box-shadow: var(--focus); background: var(--bg-1);
  }
  .search-box svg { color: var(--fg-3); flex-shrink: 0; }
  .search-box input {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    font-size: 13px;
  }
  .search-box input::placeholder { color: var(--fg-3); }
  .users { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }
  .user-row {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 8px;
    border-radius: var(--r-md); text-align: right;
    color: var(--fg);
    transition: background .12s, border-color .12s;
    border: 1px solid transparent; margin-bottom: 1px;
  }
  .user-row:hover { background: var(--bg-2); }
  .user-row.active { background: var(--bg-3); border-color: var(--line); }
  .user-row:focus-visible { box-shadow: var(--focus); }
  .ava {
    width: 32px; height: 32px; border-radius: var(--r-md);
    flex-shrink: 0; display: grid; place-items: center;
    font-size: 13px; font-weight: 600; color: #fff; letter-spacing: -.01em;
  }
  .u-body { flex: 1; min-width: 0; }
  .u-name {
    display: block; font-size: 13px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4;
  }
  .u-meta {
    display: block; font-size: 11px; color: var(--fg-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4;
    font-variant-numeric: tabular-nums;
  }
  .app.collapsed .side-title,
  .app.collapsed .side-count,
  .app.collapsed .search-box,
  .app.collapsed .u-body { display: none; }
  .app.collapsed .side-hd { justify-content: center; padding: 14px 6px 8px; }
  .app.collapsed .user-row { justify-content: center; padding: 6px; }
  .app.collapsed .users { padding: 2px 6px 12px; }

  /* Main */
  .main { grid-area: main; overflow-y: auto; }
  .container { max-width: 1240px; margin: 0 auto; padding: 20px 24px 48px; }

  .intro {
    display: grid; place-items: center; text-align: center;
    padding: 100px 24px; gap: 12px;
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-xl);
  }
  .intro-mark {
    width: 56px; height: 56px; border-radius: var(--r-lg);
    background: var(--brand-soft); border: 1px solid var(--brand-line);
    display: grid; place-items: center;
    font-size: 24px; margin-bottom: 4px;
  }
  .intro h2 { font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
  .intro p { font-size: 13px; color: var(--fg-3); max-width: 340px; line-height: 1.7; }

  /* KPI */
  .kpi-panel {
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-xl); padding: 16px 18px 18px;
    margin-bottom: 16px;
  }
  .panel-hd {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .panel-title {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    color: var(--fg-3); text-transform: uppercase;
  }
  .btn-add {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: var(--r-sm);
    font-size: 11px; font-weight: 500;
    background: var(--bg-2); color: var(--fg-2);
    border: 1px solid var(--line);
    transition: all .15s;
  }
  .btn-add:hover { background: var(--bg-3); color: var(--fg); border-color: var(--line-2); }
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .kpi {
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 12px 14px;
    display: flex; flex-direction: column; gap: 2px;
    transition: border-color .15s, background .15s;
  }
  .kpi:hover { border-color: var(--line-2); background: var(--bg-3); }
  .kpi-val {
    font-size: 24px; font-weight: 600; line-height: 1.15;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--fg);
  }
  .kpi-val.accent-info { color: var(--info); }
  .kpi-val.accent-success { color: var(--success); }
  .kpi-val.accent-danger { color: var(--danger); }
  .kpi-val.accent-warning { color: var(--warning); }
  .kpi-val.accent-brand { color: var(--brand); }
  .kpi-lbl { font-size: 11px; color: var(--fg-3); font-weight: 500; letter-spacing: .01em; }

  .custom-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .custom-card {
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 12px 14px;
    position: relative; animation: fade .25s var(--ease-out);
  }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .custom-card:hover { border-color: var(--line-2); }
  .cc-hd {
    display: flex; justify-content: space-between; align-items: center;
    gap: 6px; margin-bottom: 6px;
    font-size: 11px; color: var(--fg-3); font-weight: 500;
  }
  .cc-rm {
    width: 20px; height: 20px; border-radius: var(--r-sm);
    display: grid; place-items: center;
    color: var(--fg-3); font-size: 13px; opacity: 0;
    transition: opacity .15s, background .15s, color .15s;
  }
  .custom-card:hover .cc-rm { opacity: 1; }
  .cc-rm:hover { background: var(--danger-soft); color: var(--danger); }
  .cc-val {
    font-size: 20px; font-weight: 600; line-height: 1.15;
    color: var(--fg); letter-spacing: -.015em; font-variant-numeric: tabular-nums;
  }
  .cc-f {
    font-size: 10px; color: var(--fg-4); margin-top: 4px;
    direction: ltr; text-align: right;
  }
  .custom-form {
    margin-top: 10px; padding: 12px 14px;
    background: var(--bg-2);
    border: 1px dashed var(--line-2); border-radius: var(--r-md);
    display: grid; grid-template-columns: 1fr 1fr auto;
    gap: 10px; align-items: end;
    animation: fade .2s var(--ease-out);
  }
  .field label {
    display: block; font-size: 11px; font-weight: 500;
    color: var(--fg-3); margin-bottom: 5px;
  }
  .field input, .field select {
    width: 100%; padding: 7px 10px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--r-sm); font-size: 12px; outline: none;
    transition: all .15s;
  }
  .field input:focus, .field select:focus { border-color: var(--brand); box-shadow: var(--focus); }
  .acts { display: flex; gap: 6px; }
  .btn-sm {
    padding: 7px 14px; border-radius: var(--r-sm);
    font-size: 12px; font-weight: 500;
    background: var(--brand); color: #fff;
    transition: background .15s;
  }
  .btn-sm:hover { background: var(--brand-hover); }
  .btn-sm.ghost {
    background: transparent; color: var(--fg-2); border: 1px solid var(--line);
  }
  .btn-sm.ghost:hover { background: var(--bg-3); color: var(--fg); }

  /* Segmented */
  .seg-rail {
    display: inline-flex; gap: 2px; padding: 3px;
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: var(--r-md); margin-bottom: 16px;
    overflow-x: auto; max-width: 100%;
  }
  .seg {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: calc(var(--r-md) - 3px);
    font-size: 12px; font-weight: 500;
    color: var(--fg-2); white-space: nowrap;
    transition: all .15s var(--ease);
  }
  .seg:hover { color: var(--fg); }
  .seg.on {
    background: var(--bg-1); color: var(--fg);
    box-shadow: 0 1px 2px rgba(0,0,0,.2), var(--ring);
    font-weight: 600;
  }
  [data-theme="light"] .seg.on {
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), var(--ring);
  }
  .seg-icon { font-size: 13px; opacity: .85; }
  .panel { display: none; }
  .panel.on { display: block; animation: fade .25s var(--ease-out); }

  /* Chart cards */
  .chart-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; margin-bottom: 12px;
  }
  .chart-card {
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 14px 16px 12px;
    height: 340px; display: flex; flex-direction: column;
  }
  .chart-card.span { grid-column: 1 / -1; height: 340px; }
  .chart-hd {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 12px;
  }
  .chart-hd h3 {
    font-size: 12px; font-weight: 600; color: var(--fg);
    letter-spacing: -.005em;
  }
  .chart-hd .hint {
    font-size: 10px; color: var(--fg-3); font-weight: 500;
    padding: 2px 8px; border-radius: var(--r-sm);
    background: var(--bg-2); border: 1px solid var(--line);
  }
  .chart-body { flex: 1; min-height: 0; position: relative; }

  /* ═══════ Drilldown Modal (3 Columns) ═══════ */
  .drill-modal {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fade .2s var(--ease-out);
  }
  .drill-box {
    background: var(--bg-1);
    border: 1px solid var(--line-2);
    border-radius: var(--r-xl);
    width: 100%; max-width: 1200px;
    height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    overflow: hidden;
    animation: slideUp .3s var(--ease-out);
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .drill-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  .drill-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 700;
  }
  .drill-close {
    width: 32px; height: 32px; border-radius: var(--r-sm);
    display: grid; place-items: center;
    color: var(--fg-3); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .drill-close:hover { background: var(--bg-3); color: var(--fg); }

  /* 3 Columns Layout */
  .drill-body {
    display: grid;
    grid-template-columns: 280px 1fr 1.2fr;
    flex: 1; min-height: 0;
  }
  @media (max-width: 900px) {
    .drill-body { grid-template-columns: 1fr; }
    .drill-box { height: 90vh; }
  }

  .drill-col {
    display: flex; flex-direction: column;
    min-height: 0; overflow-y: auto;
  }
  .drill-col.center {
    border-inline-end: 1px solid var(--line);
    border-inline-start: 1px solid var(--line);
    background: var(--bg-1);
  }
  .drill-col.right {
    background: var(--bg-2);
  }
  .drill-col.left {
    background: var(--bg-0);
    align-items: center; justify-content: center;
    padding: 20px;
  }

  .col-head {
    padding: 12px 16px;
    font-size: 11px; font-weight: 700; color: var(--fg-3);
    text-transform: uppercase; letter-spacing: .05em;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
    position: sticky; top: 0; z-index: 2;
  }

  /* Right Column: File List */
  .file-list-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .15s;
    display: flex; flex-direction: column; gap: 4px;
  }
  .file-list-item:hover { background: var(--bg-3); }
  .file-list-item.active {
    background: var(--brand-soft);
    border-inline-start: 3px solid var(--brand);
  }
  .fli-name {
    font-size: 12px; font-weight: 600; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fli-meta {
    font-size: 10.5px; color: var(--fg-3);
  }

  /* Center Column: File Details */
  .details-wrap {
    padding: 24px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .detail-title {
    font-size: 18px; font-weight: 700;
    line-height: 1.4; word-break: break-all;
  }
  .detail-tags {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .detail-summary {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 16px;
    font-size: 13px; line-height: 1.8; color: var(--fg);
    white-space: pre-wrap;
  }
  .detail-meta-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .dmg-item {
    background: var(--bg-2); padding: 12px;
    border-radius: var(--r-md); border: 1px solid var(--line);
  }
  .dmg-l { font-size: 10px; color: var(--fg-3); text-transform: uppercase; margin-bottom: 4px; }
  .dmg-v { font-size: 14px; font-weight: 600; }

  /* Left Column: Image Preview */
  .preview-empty {
    color: var(--fg-3); font-size: 13px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .preview-img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: var(--r-md); box-shadow: 0 8px 24px rgba(0,0,0,.3);
    cursor: zoom-in; transition: transform .2s;
  }
  .preview-img:hover { transform: scale(1.02); }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,.88);
    backdrop-filter: blur(8px);
    display: grid; place-items: center;
    padding: 40px;
    animation: fade .2s var(--ease-out);
    cursor: zoom-out;
  }
  .lightbox img {
    max-width: 90vw; max-height: 85vh;
    border-radius: var(--r-md);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    border: 1px solid var(--line-2);
    animation: zoomIn .25s var(--ease-out);
  }
  @keyframes zoomIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .lightbox-close {
    position: absolute; top: 20px; right: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.1); color: #fff;
    display: grid; place-items: center;
    font-size: 20px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.2);
    transition: background .15s;
  }
  .lightbox-close:hover { background: rgba(255,255,255,.2); }
  .lightbox-caption {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: #fff; font-size: 12px;
    background: rgba(0,0,0,.6);
    padding: 6px 14px; border-radius: 999px;
    max-width: 80vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Chips + Table */
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    padding: 6px 12px; border-radius: var(--r-sm);
    font-size: 12px; font-weight: 500;
    color: var(--fg-2); background: var(--bg-1);
    border: 1px solid var(--line);
    transition: all .15s;
    font-variant-numeric: tabular-nums;
  }
  .chip:hover { border-color: var(--line-2); color: var(--fg); }
  .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .table-wrap {
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-lg); overflow: hidden;
  }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl thead { background: var(--bg-2); }
  .tbl th {
    text-align: right; padding: 10px 16px;
    font-size: 11px; font-weight: 500;
    letter-spacing: .02em; color: var(--fg-3);
    border-bottom: 1px solid var(--line);
  }
  .tbl td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  .tbl tbody tr:last-child td { border-bottom: none; }
  .tbl tbody tr { transition: background .12s; }
  .tbl tbody tr:hover { background: var(--bg-2); }
  .fname {
    max-width: 280px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fname .sub {
    display: block; font-size: 11px; color: var(--fg-3);
    font-weight: 400; direction: ltr; text-align: right;
    margin-top: 1px; font-variant-numeric: tabular-nums;
  }
  .tag {
    display: inline-block; padding: 2px 8px;
    border-radius: var(--r-sm); font-size: 11px; font-weight: 500;
    white-space: nowrap; margin-inline-end: 4px;
    border: 1px solid transparent;
  }
  .tag.rel { background: var(--success-soft); color: var(--success); border-color: color-mix(in srgb, var(--success) 20%, transparent); }
  .tag.unrel { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 20%, transparent); }
  .tag.t-low { background: var(--success-soft); color: var(--success); border-color: color-mix(in srgb, var(--success) 20%, transparent); }
  .tag.t-medium { background: var(--warning-soft); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 20%, transparent); }
  .tag.t-high, .tag.t-critical { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 20%, transparent); }
  .tag.t-unknown { background: var(--bg-3); color: var(--fg-3); border-color: var(--line); }
  .rel-cell { min-width: 100px; }
  .rel-num { font-size: 12px; font-weight: 600; color: var(--brand); font-variant-numeric: tabular-nums; }
  .rel-bar { height: 3px; border-radius: 3px; background: var(--bg-3); margin-top: 5px; overflow: hidden; }
  .rel-bar i {
    display: block; height: 100%; width: 0; border-radius: 3px;
    background: var(--brand); transition: width .8s var(--ease-out);
  }

  /* Chat */
  .chat-shell {
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-lg); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .chat-bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 12px; border-radius: var(--r-sm);
    font-size: 12px; font-weight: 500;
    border: 1px solid var(--line); background: var(--bg-1);
    color: var(--fg);
    transition: all .15s;
  }
  .btn:hover:not(:disabled) { background: var(--bg-3); border-color: var(--line-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary {
    background: var(--brand); color: #fff; border-color: var(--brand);
  }
  .btn.primary:hover:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); }
  .chat-bar input[type="text"] {
    flex: 1; min-width: 140px; padding: 6px 10px;
    border-radius: var(--r-sm); background: var(--bg);
    border: 1px solid var(--line); font-size: 12px; outline: none;
    transition: all .15s;
  }
  .chat-bar input[type="text"]:focus { border-color: var(--brand); box-shadow: var(--focus); }
  .chat-stat { font-size: 11px; color: var(--fg-3); font-weight: 500; padding: 0 4px; }

  .chat-body {
    flex: 1; min-height: 260px; max-height: 480px;

  .chat-intro {

  .chat-intro .ci { font-size: 28px; opacity: .6; }
  .chat-intro h3 { font-size: 13px; color: var(--fg); font-weight: 600; }
  .chat-intro p { font-size: 12px; max-width: 300px; line-height: 1.7; }
  .msg { display: flex; gap: 10px; margin-bottom: 14px; animation: fade .2s var(--ease-out); }
  .msg.user { flex-direction: row-reverse; }
  .msg-av {
    width: 28px; height: 28px; border-radius: var(--r-md); flex-shrink: 0;

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;

  @keyframes blink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }
  .chat-img { padding: 12px 14px; border-top: 1px solid var(--line); background: var(--bg-2); }
  .chat-img img {
    max-width: 100%; max-height: 400px; border-radius: var(--r-md);

  .chat-foot {

  .chat-foot input {
    flex: 1; min-width: 0; padding: 8px 12px;

  .chat-foot input:focus { border-color: var(--brand); box-shadow: var(--focus); }

  /* Psychology */
  .psy-hd {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 14px;

  .psy-hd h3 { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .psy-acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .psy-scores {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-bottom: 14px;
  }
  .psy-score {
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 14px 16px; text-align: center;
  }
  .ps-l {
    font-size: 10px; font-weight: 600; letter-spacing: .04em;
    color: var(--fg-3); text-transform: uppercase; margin-bottom: 4px;
  }
  .ps-v {
    font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;

  }
  .psy-narrative {
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 16px 18px;
    font-size: 13px; line-height: 1.9; color: var(--fg); white-space: pre-wrap;
  }
  .psy-signals { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .psy-sig {
    font-size: 11px; font-weight: 500; padding: 3px 9px;
    border-radius: var(--r-sm); background: var(--bg-2);
    color: var(--fg-2); border: 1px solid var(--line);
  }

  /* States */
  .spinner {
    width: 26px; height: 26px;
    border: 2px solid var(--line); border-top-color: var(--brand);
    border-radius: 50%; animation: spin .7s linear infinite;
    margin: 48px auto;
  }
  .empty {
    display: grid; place-items: center; text-align: center;
    padding: 60px 24px; gap: 8px; color: var(--fg-2);
  }
  .empty .ico { font-size: 32px; opacity: .5; }
  .empty h3 { font-size: 14px; color: var(--fg); font-weight: 600; }
  .empty p { font-size: 12px; color: var(--fg-3); }
  .error {
    background: var(--danger-soft);
    border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    color: var(--danger); padding: 12px 14px;
    border-radius: var(--r-md); font-size: 13px;
  }

  /* Responsive */
  @media (max-width: 1024px) {
    .app { grid-template-columns: 240px 1fr; }
    .container { padding: 16px 18px 40px; }
  }
  @media (max-width: 900px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 56px auto 1fr;
      grid-template-areas: "top" "side" "main";
      height: auto; min-height: 100dvh;
    }
    .app.collapsed { grid-template-columns: 1fr; }
    .app.collapsed .side-title, .app.collapsed .side-count,
    .app.collapsed .search-box, .app.collapsed .u-body { display: revert; }
    .app.collapsed .side-hd { justify-content: space-between; padding: 14px 14px 10px; }
    .app.collapsed .user-row { justify-content: flex-start; padding: 8px; }
    .app.collapsed .users { padding: 2px 8px 12px; }
    .side { max-height: 340px; border-inline-end: none; border-bottom: 1px solid var(--line); }
    .users { max-height: 240px; }
    .chart-grid { grid-template-columns: 1fr; }
    .tbl th:nth-child(3), .tbl td:nth-child(3) { display: none; }
    .custom-form { grid-template-columns: 1fr; }
    .crumbs { display: none; }
  }
  @media (max-width: 640px) {
    .top { padding: 0 12px; gap: 8px; }
    .container { padding: 14px 12px 32px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .kpi-val { font-size: 20px; }
    .seg { padding: 6px 10px; font-size: 11px; }
    .seg-icon { display: none; }
    .tbl th:nth-child(2), .tbl td:nth-child(2) { display: none; }
    .tbl th, .tbl td { padding: 10px 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
  canvas { font-family: Vazirmatn, Tahoma, sans-serif !important; }
</style>

<script>
/* ═══════ Helpers ═══════ */
function getCsrfToken(){
  const m = document.cookie.match(/csrftoken=([^;]+)/);
  return m ? m[1] : '';
}
const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const fmtTime = s => s ? escapeHtml(String(s).replace('T',' ').slice(0,16)) : '—';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ⚠️ الگوی آدرس تصویر — در صورت نیاز به endpoint دیگر تغییر دهید
const IMAGE_URL_PATTERN = (id) => `/media/uploads/${id}/`;

const AVATAR_GRADS = [
  'linear-gradient(135deg,#6366F1,#8B5CF6)',
  'linear-gradient(135deg,#10B981,#14B8A6)',
  'linear-gradient(135deg,#F59E0B,#EF4444)',
  'linear-gradient(135deg,#A855F7,#EC4899)',
  'linear-gradient(135deg,#3B82F6,#06B6D4)',
  'linear-gradient(135deg,#EF4444,#F59E0B)'
];
const avatarBg = id => AVATAR_GRADS[Math.abs(num(id)) % AVATAR_GRADS.length];
const initial = n => escapeHtml((n||'?').trim().charAt(0).toUpperCase());

const THREAT = {
  low:{t:'تهدید: کم',c:'t-low'},
  medium:{t:'تهدید: متوسط',c:'t-medium'},
  high:{t:'تهدید: بالا',c:'t-high'},
  critical:{t:'تهدید: بحرانی',c:'t-critical'}
};
const threatPill = lvl => {
  const m = THREAT[String(lvl||'').toLowerCase()] || {t:escapeHtml(lvl||'—'),c:'t-unknown'};
  return `<span class="tag ${m.c}">${m.t}</span>`;
};

async function getJSON(url){
  const r = await fetch(url, {headers:{'Accept':'application/json'}, credentials:'same-origin'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function countUp(el){
  const end = parseFloat(el.dataset.count);
  const dec = parseInt(el.dataset.dec || 0);
  const t0 = performance.now();
  const dur = 900;
  const fmt = v => dec ? toFa(v.toFixed(dec)) : toFa(Math.round(v));
  (function tick(t){
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(end * e);
    if(p < 1) requestAnimationFrame(tick);
  })(t0);
}

/* Lightbox */
function openLightbox(src, caption){
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  const cap = document.getElementById('lightboxCap');
  if(!lb || !img) return;
  img.src = src; img.alt = caption || '';
  cap.textContent = caption || '';
  lb.style.display = 'grid';
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e, force){
  if(e && !force && e.target !== e.currentTarget && e.target.tagName !== 'BUTTON') return;
  if(e && e.stopPropagation) e.stopPropagation();
  const lb = document.getElementById('lightbox');
  if(!lb) return;
  lb.style.display = 'none';
  const img = document.getElementById('lightboxImg');
  if(img) img.src = '';
  document.body.style.overflow = '';
}
window.openLightbox = openLightbox;
window.closeLightbox = closeLightbox;

/* ═══════ Theme ═══════ */
function applyThemeMeta(){
  document.getElementById('themeColor').content =
    document.documentElement.dataset.theme === 'light' ? '#FAFAFA' : '#09090B';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  const swap = () => {
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem('theme', next); }catch(e){}
    applyThemeMeta();
    if(lastData && document.getElementById('chartTopics')) buildCharts(lastData);
    if(activeTopicName) renderDrillCard(activeTopicName);
  };
  document.startViewTransition ? document.startViewTransition(swap) : swap();
});
applyThemeMeta();

/* ═══════ Chart.js ═══════ */
Chart.defaults.font.family = 'Vazirmatn, Tahoma, sans-serif';
Chart.defaults.color = css('--fg-2');
const PALETTE = () => [
  css('--brand'), css('--success'), css('--warning'), css('--danger'),
  '#A855F7', '#14B8A6', css('--info'), css('--fg-3')
];

const hexA = (hex, a) => {
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.replace(/./g,'$&$&') : h, 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
};
const vGrad = (hex, a0=1, a1=.3) => ctx => {
  const a = ctx.chart.chartArea; if(!a) return hex;
  const g = ctx.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
  g.addColorStop(0, hexA(hex, a0));
  g.addColorStop(1, hexA(hex, a1));
  return g;
};

const centerText = {
  id:'centerText',
  afterDraw(c, _, o){
    if (c.config.type !== 'doughnut' || !o.text) return;
    const {ctx, chartArea:a} = c;
    const x = (a.left+a.right)/2, y = (a.top+a.bottom)/2;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = css('--fg');
    ctx.font = '600 22px Vazirmatn, sans-serif';
    ctx.fillText(o.text, x, y - 6);
    ctx.fillStyle = css('--fg-3');
    ctx.font = '500 10px Vazirmatn, sans-serif';
    ctx.fillText(o.sub, x, y + 16);
    ctx.restore();
  }
};

function tooltip(){
  return {
    backgroundColor: css('--tip'),
    borderColor: css('--separator'),
    borderWidth: 1,
    titleColor: css('--label'),
    bodyColor: css('--label-2'),
    padding: 10, cornerRadius: 8, displayColors: false,
    rtl: true, textDirection: 'rtl',

    bodyFont: {size: 12, family: 'Vazirmatn'},

function buildCharts(d){
  destroyCharts();
  const matrix = d.matrix_2x2 || {org_related:0, org_unrelated:0, nonorg_related:0, nonorg_unrelated:0};
  const topicDist = d.topic_distribution || [];

  const txt = css('--label-2'), grid = css('--separator'), P = PALETTE();
  const base = {responsive:true, maintainAspectRatio:false};

  const cM = document.getElementById('chartMatrix');
  if (cM) {
    const labels = ['Org Related', 'Org Unrelated', 'Non-Org Related', 'Non-Org Unrelated'];
    let values = [matrix.org_related, matrix.org_unrelated, matrix.nonorg_related, matrix.nonorg_unrelated];
    if (values.every(v => v === 0)) { values = [0, 0, 0, 0]; }
    const colors = [css('--success'), css('--warning'), css('--info'), css('--danger')];
    charts.matrix = new Chart(cM, {
      type: 'bar',
      data: { labels,
        datasets: [{ data: values, backgroundColor: colors,
          borderRadius: 6, borderSkipped: false, categoryPercentage: .62, barPercentage: .78 }] },
      options: { ...base,
        animation: { duration: 1100, easing: 'easeOutQuart' },
        plugins: { legend: {display:false}, tooltip: tooltip() },
        scales: { x: {grid:{display:false}, border:{display:false},
          ticks:{color:css('--label'), font:{size:10, weight:'500', family:'Vazirmatn'}}},
          y: {beginAtZero:true, grid:{color:grid}, border:{display:false},
          ticks:{precision:0, color:txt, family:'Vazirmatn', font:{size:10}}} } }
    });
  }

  const cTo = document.getElementById('chartTopics');
  if (cTo) {
    if (topicDist.length) {
      const topN = topicDist.slice(0, 10);
      const total = topN.reduce((s,t) => s + (t.count || 0), 0);
      charts.topics = new Chart(cTo, {
        type: 'doughnut',
        data: { labels: topN.map(t => t.name),
          datasets: [{ data: topN.map(t => t.count),
            backgroundColor: topN.map((_,i) => P[i % P.length]),
            borderWidth: 0, hoverOffset: 10, spacing: 2, borderRadius: 6 }] },
        options: { ...base, cutout: '68%',
          onClick: (evt, els) => {
            if (!els.length) return;
            const idx = els[0].index;
            const topic = topN[idx];
            if (topic) {
              activeTopicName = topic.name;
              renderDrillCard(topic.name);
            }
          },
          animation: { animateRotate: true, animateScale: true, duration: 1200 },
          plugins: { centerText: {text: total, sub: 'Topics'},
            tooltip: tooltip(),
            legend: { position: 'bottom', labels: {usePointStyle: true, pointStyle: 'circle', boxWidth: 6, padding: 8, color: txt, font: {size: 10, family: 'Vazirmatn'}} } } },
        plugins: [centerText]
      });
    }
  }
}

function isImageFile(f){
  const k = String(f.kind || '').toLowerCase();
  const n = String(f.file_name || '').toLowerCase();
  if(['image','img','picture','photo'].includes(k)) return true;
  return /\.(jpg|jpeg|png|gif|bmp|webp|tiff|svg)$/.test(n);
}

function pickImageUrl(f){
  if (f.image_url) return f.image_url;
  if (f.thumbnail_url) return f.thumbnail_url;
  if (f.preview_url) return f.preview_url;
  if (f.url) return f.url;
  if (f.file_url) return f.file_url;

  const id = f.file_id || f.id;
  if (id) return IMAGE_URL_PATTERN(id);

  return '';
}

function fileIcon(f){
  const k = String(f.kind || '').toLowerCase();
  const n = String(f.file_name || '').toLowerCase();
  if(isImageFile(f)) return '🖼️';
  if(k === 'pdf' || n.endsWith('.pdf')) return '📕';
  if(k === 'doc' || /\.(docx?|rtf)$/.test(n)) return '📘';
  if(k === 'sheet' || /\.(xlsx?|csv)$/.test(n)) return '📗';
  if(k === 'text' || /\.(txt|md|log)$/.test(n)) return '📄';
  return '📎';
}

function escapeAttr(s){
  return String(s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

/* ═══════ State ═══════ */
let currentUserId = null;
let currentTab = 'overview';
let currentFilter = 'all';
let usersCache = [];
let lastSig = '';
let lastData = null;
let reqSeq = 0;
let usersSig = '';

/* ═══════ Custom Stats ═══════ */
const CUSTOM_STATS_KEY = 'ai_report_custom_stats_v1';
function loadCustomStats(userId){
  try{
    const all = JSON.parse(localStorage.getItem(CUSTOM_STATS_KEY) || '{}');
    return all[String(userId)] || [];
  }catch(e){ return []; }
}
function saveCustomStats(userId, list){
  try{
    const all = JSON.parse(localStorage.getItem(CUSTOM_STATS_KEY) || '{}');
    all[String(userId)] = list;
    localStorage.setItem(CUSTOM_STATS_KEY, JSON.stringify(all));
  }catch(e){}
}
const STAT_FORMULAS = {
  total: { label:'کل فایل‌ها', fn: b => num(b.total_files) },
  related: { label:'فایل‌های مرتبط', fn: b => num(b.related_files_count) },
  unrelated: { label:'فایل‌های غیرمرتبط', fn: b => num(b.unrelated_files_count) },
  suspicious: { label:'فایل‌های مشکوک', fn: b => num(b.suspicious_files_count) },
  relevance: { label:'میانگین relevance', fn: b => num(b.relevance_avg), dec:2 },
  related_pct: { label:'درصد مرتبط', fn: b => {
    const t = num(b.total_files); return t ? num(b.related_files_count) / t * 100 : 0;
  }, dec:1, suffix:'٪' },
  susp_pct: { label:'درصد مشکوک', fn: b => {
    const t = num(b.total_files); return t ? num(b.suspicious_files_count) / t * 100 : 0;
  }, dec:1, suffix:'٪' },
  topics_count: { label:'تعداد موضوعات', fn: b => (b.top_topics||[]).length },
};
function evaluateCustomStat(stat, behavior){
  const f = STAT_FORMULAS[stat.formula];
  if(!f) return { value:'—', suffix:'' };
  const v = f.fn(behavior);
  const dec = f.dec || 0;
  return {
    value: dec ? toFa(v.toFixed(dec)) : toFa(Math.round(v)),
    suffix: f.suffix || ''
  };
}

/* ═══════ Users sidebar ═══════ */
async function loadUsers(){
  const list = document.getElementById('usersList');
  if(!usersCache.length) list.innerHTML = '<div class="spinner"></div>';
  try{
    const d = await getJSON('/api/behavior-analysis/');
    if(!d.success || !d.items || !d.items.length){
      usersCache = [];
      list.innerHTML = '<div class="empty"><span class="ico">🫥</span><h3>هیچ کاربری</h3><p>هنوز تحلیلی انجام نشده</p></div>';
      document.getElementById('userCount').textContent = '۰';
      return;
    }
    const sig = JSON.stringify(d.items);
    if(sig === usersSig) return;
    usersSig = sig;
    usersCache = d.items;
    document.getElementById('userCount').textContent = toFa(d.items.length);
    filterUsers();
  }catch(e){
    if(!usersCache.length){
      list.innerHTML = '<div class="empty"><span class="ico">⚠️</span><h3>خطا در بارگذاری</h3></div>';
    }
  }
}

function renderUserList(items){
  const list = document.getElementById('usersList');
  if(!items.length){
    list.innerHTML = '<div class="empty"><span class="ico">🔍</span><h3>موردی پیدا نشد</h3></div>';

  }

      <span class="ava" style="background:${avatarBg(u.user_id)}">${initial(u.username)}</span>
      <span class="u-body">

      </span>

}

function filterUsers(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  renderUserList(usersCache.filter(u => (u.username||'').toLowerCase().includes(q)));
}

document.getElementById('usersList').addEventListener('click', e => {
  const el = e.target.closest('.user-row');

/* ═══════ User detail ═══════ */
async function loadUser(userId, silent, force){
  const seq = ++reqSeq;
  const changed = userId !== currentUserId;
  currentUserId = userId;
  document.querySelectorAll('.user-row').forEach(el =>
    el.classList.toggle('active', parseInt(el.dataset.uid, 10) === userId));

  const main = document.getElementById('mainArea');
  if(!silent || changed){
    main.innerHTML = '<div class="container"><div class="spinner"></div></div>';
    lastSig = '';
    destroyDrillCharts();
  }

  try{
    const d = await getJSON(`/api/behavior-analysis/${userId}/`);
    if(seq !== reqSeq) return;
    if(!d.success){
      main.innerHTML = `<div class="container"><div class="error">${escapeHtml(d.msg||'خطا')}</div></div>`;
      return;
    }
    const sig = JSON.stringify(d);
    if(!force && sig === lastSig) return;
    if(silent && !force && currentTab === 'chat') return;
    lastSig = sig;
    renderUser(d);
  }catch(e){
    if(seq !== reqSeq) return;
    if(!silent){
      main.innerHTML = '<div class="container"><div class="error">خطا در ارتباط با سرور</div></div>';
    }
  }
}

function setTab(name){
  currentTab = name;
  document.querySelectorAll('.seg').forEach(t =>
    t.classList.toggle('on', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p =>
    p.classList.toggle('on', p.id === 'panel-' + name));
  if(name === 'overview') Object.values(charts).forEach(c => c && c.resize());
  if(name === 'files'){
    requestAnimationFrame(() =>
      document.querySelectorAll('.rel-bar i').forEach(i => i.style.width = i.dataset.w + '%'));
  }
}

function applyFilter(f){
  currentFilter = f;
  document.querySelectorAll('.chip-row .chip').forEach(c =>
    c.classList.toggle('on', c.dataset.f === f));
  document.querySelectorAll('#fileTableBody tr').forEach(row => {
    const rel = row.dataset.rel === '1';
    const susp = row.dataset.susp === '1';
    row.style.display =
      (f==='all' || (f==='related'&&rel) || (f==='unrelated'&&!rel) || (f==='suspicious'&&susp))
      ? '' : 'none';
  });
}

function renderCustomStats(userId){

      </div>`;
  }).join('');

function removeCustomStat(index){
  if(!currentUserId) return;
  const list = loadCustomStats(currentUserId);
  list.splice(index, 1);
  saveCustomStats(currentUserId, list);
  renderCustomStats(currentUserId);
}
window.removeCustomStat = removeCustomStat;

function toggleCustomStatForm(){
  const form = document.getElementById('customStatForm');
  if(!form) return;
  form.style.display = form.style.display === 'none' ? 'grid' : 'none';
  if(form.style.display === 'grid'){
    const labelInput = document.getElementById('csLabel');
    if(labelInput) labelInput.focus();
  }
}
window.toggleCustomStatForm = toggleCustomStatForm;

function submitCustomStat(e){
  e.preventDefault();
  if(!currentUserId) return;
  const label = (document.getElementById('csLabel')?.value || '').trim();
  const formula = document.getElementById('csFormula')?.value || 'total';
  if(!label) return;
  const list = loadCustomStats(currentUserId);
  list.push({ label, formula });
  saveCustomStats(currentUserId, list);
  document.getElementById('csLabel').value = '';
  toggleCustomStatForm();
  renderCustomStats(currentUserId);
}
window.submitCustomStat = submitCustomStat;

  const baseStatsHtml = baseStats.map(s => `

  const filesHtml = files.length === 0
    ? '<div class="empty"><span class="ico">🗂️</span><h3>هیچ فایلی تحلیل نشده</h3></div>'
    : `
      <div class="chip-row" id="filterChips">
        <button class="chip" data-f="all">همه (${toFa(files.length)})</button>
        <button class="chip" data-f="related">مرتبط (${toFa(rel)})</button>
        <button class="chip" data-f="unrelated">غیرمرتبط (${toFa(num(b.unrelated_files_count))})</button>
        <button class="chip" data-f="suspicious">مشکوک (${toFa(num(b.suspicious_files_count))})</button>
      </div>
      <div class="table-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th>فایل</th>
              <th>موضوع</th>
              <th>وضعیت</th>
              <th>relevance</th>
            </tr>
          </thead>
          <tbody id="fileTableBody">
            ${files.map(f => {
              const susp = ['high','critical'].includes(String(f.threat_level||'').toLowerCase());
              const sc = num(f.relevance_score);
              return `
                <tr data-rel="${f.is_related?1:0}" data-susp="${susp?1:0}">
                  <td><div class="fname">${escapeHtml(f.file_name)}<span class="sub">${fmtTime(f.analyzed_at)}</span></div></td>
                  <td style="color:var(--fg-2);font-size:12px">${escapeHtml(f.top_topic||'—')}</td>
                  <td><span class="tag ${f.is_related?'rel':'unrel'}">${f.is_related?'مرتبط':'غیرمرتبط'}</span>${threatPill(f.threat_level)}</td>
                  <td class="rel-cell">
                    <div class="rel-num">${toFa(sc.toFixed(2))}</div>
                    <div class="rel-bar"><i data-w="${Math.max(0,Math.min(100,sc*100))}"></i></div>
                  </td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;

  destroyCharts();
  destroyDrillCharts();

  document.getElementById('mainArea').innerHTML = `
    <div class="container">

      <section class="kpi-panel">
        <div class="panel-hd">
          <span class="panel-title">آمار کلی</span>
          <button class="btn-add" onclick="toggleCustomStatForm()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            کارت آماری
          </button>
        </div>

        <div class="kpi-grid">${baseStatsHtml}</div>
        <div class="custom-grid" id="customStatsGrid"></div>

        <form class="custom-form" id="customStatForm" style="display:none" onsubmit="submitCustomStat(event)">
          <div class="field">
            <label for="csLabel">عنوان کارت</label>
            <input type="text" id="csLabel" maxlength="40" placeholder="مثلاً: درصد مشکوک" required>
          </div>
          <div class="field">
            <label for="csFormula">فرمول</label>
            <select id="csFormula">
              ${Object.entries(STAT_FORMULAS).map(([k,v]) =>
                `<option value="${k}">${v.label}</option>`).join('')}
            </select>
          </div>
          <div class="acts">
            <button type="button" class="btn-sm ghost" onclick="toggleCustomStatForm()">انصراف</button>
            <button type="submit" class="btn-sm">افزودن</button>
          </div>
        </form>
      </section>

      <nav class="seg-rail" id="tabsBar" role="tablist">
        <button class="seg" data-tab="overview"><span class="seg-icon">📊</span><span>نمای کلی</span></button>
        <button class="seg" data-tab="files"><span class="seg-icon">📁</span><span>فایل‌ها</span></button>
        <button class="seg" data-tab="chat"><span class="seg-icon">💬</span><span>چت با AI</span></button>
        <button class="seg" data-tab="psychology"><span class="seg-icon">🧠</span><span>روانشناسی</span></button>
      </nav>

      <div class="panel" id="panel-overview">
        <div class="chart-grid">
          <div class="chart-card">
            <div class="chart-hd">
              <h3>Org vs Non-Org Matrix</h3>
            </div>
            <div class="chart-body"><canvas id="chartMatrix"></canvas></div>
          </div>
          <div class="chart-card">
            <div class="chart-hd">
              <h3>Dominant Topics</h3>
              <span class="hint">Click to drill down</span>
            </div>
            <div class="chart-body"><canvas id="chartTopics"></canvas></div>
          </div>
        </div>

        <div id="drillWrap"></div>
      </div>

      <div class="panel" id="panel-files">${filesHtml}</div>

      <div class="panel" id="panel-chat">
        <div class="chat-shell">
          <div class="chat-bar">
            <button class="btn primary" id="chatNewSession"> جلسه جدید</button>
            <input type="text" id="chatImageTopic" maxlength="300" placeholder="موضوع تصویر...">
            <button class="btn" id="chatGenerateImage" disabled> تولید تصویر</button>
            <span class="chat-stat" id="chatStatus">آماده</span>
          </div>
          <div class="chat-body" id="chatMessages">
            <div class="chat-intro">
              <span class="ci"></span>
              <h3>چت با هوش مصنوعی</h3>
              <p>برای شروع، روی «جلسه جدید» بزنید تا روی فایل‌های این کاربر گفتگو کنید</p>
            </div>
          </div>
          <div id="chatImageResult" class="chat-img" style="display:none"></div>
          <div class="chat-foot">
            <input type="text" id="chatInput" placeholder="سوال خود را بنویسید..." disabled>
            <button class="btn primary" id="chatSend" disabled>ارسال</button>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-psychology">
        <div class="psy-hd">
          <h3> تحلیل روانشناسی رفتار</h3>
          <div class="psy-acts">
            <button class="btn" onclick="psyRunFresh(window.currentUserId || 0)"> تحلیل مجدد</button>
            <button class="btn" onclick="analyzeAllFiles(window.currentUserId||0)"> تحلیل فایل‌ها</button>
          </div>
        </div>
        <div id="psyBox"></div>
      </div>

    </div>
  `;

  document.querySelectorAll('.kpi .kpi-val').forEach(countUp);
  document.querySelectorAll('#tabsBar .seg').forEach(btn =>
    btn.addEventListener('click', () => setTab(btn.dataset.tab)));
  document.querySelectorAll('#filterChips .chip').forEach(chip =>
    chip.addEventListener('click', () => applyFilter(chip.dataset.f)));

  applyFilter(currentFilter);
  setTab(currentTab);
  buildCharts(d);
  renderCustomStats(user.id);

  if(activeTopicName) renderDrillCard(activeTopicName);

  const chatFiles = files.map(f => f.file_id).filter(Boolean);
  chatBind(chatFiles, d.user.id);

  psyLoadForUser(user.id);
}

setInterval(() => {
  if(document.hidden) return;
  loadUsers();
  if(currentUserId) loadUser(currentUserId, true);
}, 30000);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && currentUserId) loadUser(currentUserId, true);
});

const chatState = { sessionId: null, sending: false, filesForChat: [], targetUserId: null };
const chatEl = id => document.getElementById(id);

function chatSetEnabled(enabled){
  const input = chatEl('chatInput'), send = chatEl('chatSend');
  if(input) input.disabled = !enabled;
  if(send) send.disabled = !enabled || chatState.sending;
  const imageBtn = chatEl('chatGenerateImage');
  if(imageBtn) imageBtn.disabled = !enabled || chatState.sending;
}
function chatAppend(role, content){
  const wrap = chatEl('chatMessages');
  if(!wrap) return null;
  const empty = wrap.querySelector('.chat-intro');
  if(empty) empty.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-av">${role === 'user' ? '' : ''}</div>
    <div class="msg-body">${escapeHtml(content)}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div;
}
function chatShowTyping(){
  const wrap = chatEl('chatMessages');
  if(!wrap) return null;
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'chatTyping';
  div.innerHTML = `
    <div class="msg-av"></div>
    <div class="msg-body"><div class="typing"><i></i><i></i><i></i></div></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div;
}
async function chatStartSession(){
  const btn = chatEl('chatNewSession'), status = chatEl('chatStatus');
  if(!btn) return;
  btn.disabled = true;
  if(status) status.textContent = 'در حال ساخت جلسه...';
  try{
    const r = await fetch('/api/report-chat/start/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
      body: JSON.stringify({
        file_ids: chatState.filesForChat,
        target_user_id: chatState.targetUserId,
        title: `چت روی ${chatState.filesForChat.length} فایل`,
      }),
    });
    const d = await r.json();
    if(!d.success){ if(status) status.textContent = d.msg || 'خطا'; return; }
    chatState.sessionId = d.session_id;
    if(status) status.textContent = `جلسه #${d.session_id} — ${d.file_count} فایل`;
    const wrap = chatEl('chatMessages');
    if(wrap) wrap.innerHTML = '';
    chatSetEnabled(true);
    chatEl('chatInput')?.focus();
  }catch(e){
    if(status) status.textContent = 'خطای شبکه';
  }finally{ btn.disabled = false; }
}
async function chatSendMessage(){
  if(chatState.sending) return;
  const input = chatEl('chatInput'), status = chatEl('chatStatus');
  const q = (input?.value || '').trim();
  if(!q) return;
  if(!chatState.sessionId){
    await chatStartSession();
    if(!chatState.sessionId) return;
  }
  chatState.sending = true;
  if(input) input.value = '';
  chatAppend('user', q);
  chatSetEnabled(false);
  const typing = chatShowTyping();
  if(status) status.textContent = 'در حال پاسخ...';
  try{
    const r = await fetch(`/api/report-chat/${chatState.sessionId}/ask/`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
      body: JSON.stringify({question: q}),
    });
    const d = await r.json();
    if(typing) typing.remove();
    if(d.success){
      chatAppend('assistant', d.answer);
      if(status) status.textContent = 'آماده';
    }else{
      chatAppend('assistant', ' ' + (d.msg || 'خطا در دریافت پاسخ'));
      if(status) status.textContent = 'خطا';
    }
  }catch(e){
    if(typing) typing.remove();
    chatAppend('assistant', ' خطای شبکه');
    if(status) status.textContent = 'خطای شبکه';
  }finally{
    chatState.sending = false;
    chatSetEnabled(true);
    chatEl('chatInput')?.focus();
  }
}
async function chatGenerateImage(){
  const status = chatEl('chatStatus');
  const btn = chatEl('chatGenerateImage');
  const resultBox = chatEl('chatImageResult');
  if(!chatState.sessionId || !btn || btn.disabled) return;
  const topic = (chatEl('chatImageTopic')?.value || '').trim();
  if(!topic){
    if(status) status.textContent = 'ابتدا موضوع تصویر را وارد کنید';
    chatEl('chatImageTopic')?.focus();
    return;
  }
  btn.disabled = true;
  btn.textContent = ' در حال تولید...';
  if(resultBox){ resultBox.style.display = 'block'; resultBox.textContent = 'در حال تولید تصویر...'; }
  try{
    const response = await fetch(`/api/report-chat/${chatState.sessionId}/generate-image/`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
      body: JSON.stringify({ topic })
    });
    const data = await response.json();
    if(!response.ok || !data.success) throw new Error(data.msg || 'تولید تصویر ناموفق بود');
    let imageUrl = data.image_base64;
    if(!imageUrl.startsWith('data:')){
      const mime = ['image/png','image/jpeg','image/webp'].includes(data.mime_type) ? data.mime_type : 'image/png';
      imageUrl = `data:${mime};base64,${imageUrl}`;
    }
    const img = document.createElement('img');
    img.src = imageUrl; img.alt = topic; img.loading = 'lazy';
    resultBox.replaceChildren(img);
    if(data.image_prompt){
      const caption = document.createElement('p');
      caption.className = 'cap';
      caption.textContent = `پرامپت: ${data.image_prompt}`;
      resultBox.appendChild(caption);
    }
    if(status) status.textContent = 'تصویر با موفقیت تولید شد';
  }catch(error){
    if(resultBox) resultBox.textContent = error.message;
    if(status) status.textContent = 'خطا در تولید تصویر';
  }finally{
    btn.textContent = ' تولید تصویر';
    btn.disabled = !chatState.sessionId;
  }
}
function chatBind(files, targetUserId){
  chatState.sessionId = null;
  chatState.filesForChat = files || [];
  chatState.targetUserId = targetUserId;
  chatSetEnabled(false);
  const newBtn = chatEl('chatNewSession');
  if(!newBtn) return;
  newBtn.onclick = chatStartSession;
  chatEl('chatSend').onclick = chatSendMessage;
  chatEl('chatGenerateImage').onclick = chatGenerateImage;
  chatEl('chatInput').onkeydown = (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); chatSendMessage(); }
  };
  const wrap = chatEl('chatMessages');
  if(wrap){
    wrap.innerHTML = `
      <div class="chat-intro">
        <span class="ci"></span>
        <h3>چت با هوش مصنوعی</h3>
        <p>برای شروع، روی «جلسه جدید» بزنید تا روی فایل‌های این کاربر گفتگو کنید</p>
      </div>`;
  }
  const status = chatEl('chatStatus');
  if(status) status.textContent = `آماده (${chatState.filesForChat.length} فایل)`;
}

/* ═══════ Psychology ═══════ */
async function psyLoadForUser(userId){
  const box = document.getElementById('psyBox');
  if(!box) return;
  box.innerHTML = '<div class="spinner"></div>';
  try{
    const r = await fetch(`/api/user/${userId}/psychology/`, {credentials:'same-origin'});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'خطا');
    if(!j.data){
      box.innerHTML = `
        <div class="empty">
          <span class="ico"></span>
          <h3>هنوز تحلیلی ذخیره نشده</h3>
          <p>دکمه «تحلیل مجدد» را بزنید تا تحلیل انجام شود</p>
        </div>`;
      return;
    }
    const d = j.data;
    const color = d.risk_score >= 0.7 ? 'var(--danger)'
                : (d.risk_score >= 0.35 ? 'var(--warning)' : 'var(--success)');
    box.innerHTML = `
      <div class="psy-scores">
        <div class="psy-score"><div class="ps-l">ریسک</div><div class="ps-v" style="color:${color}">${(d.risk_score||0).toFixed(2)}</div></div>
        <div class="psy-score"><div class="ps-l">ناهنجاری</div><div class="ps-v">${(d.anomaly_score||0).toFixed(2)}</div></div>
        <div class="psy-score"><div class="ps-l">فشار کاری</div><div class="ps-v">${(d.stress_index||0).toFixed(2)}</div></div>
        <div class="psy-score"><div class="ps-l">نقش‌پذیری</div><div class="ps-v">${(d.role_fit_score||0).toFixed(2)}</div></div>
      </div>
      <div class="psy-narrative">${escapeHtml(d.narrative||'—')}</div>
      ${(d.signals && d.signals.length) ? `
        <div class="psy-signals">
          ${d.signals.map(s => `<span class="psy-sig">${escapeHtml(s.code)}</span>`).join('')}
        </div>` : ''}
    `;
  }catch(e){
    box.innerHTML = `<div class="error">خطا: ${escapeHtml(e.message)}</div>`;
  }
}
async function psyRunFresh(userId){
  const box = document.getElementById('psyBox');
  if(box) box.innerHTML = `
    <div class="empty">
      <span class="ico">⏳</span>
      <h3>در حال تحلیل با هوش مصنوعی</h3>
      <p>ممکن است ۱ تا ۳ دقیقه طول بکشد...</p>
    </div>`;
  try{
    const r = await fetch(`/api/user/${userId}/psychology/`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'X-CSRFToken': getCsrfToken()},
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'خطا');
    psyLoadForUser(userId);
  }catch(e){
    if(box) box.innerHTML = `<div class="error">خطا: ${escapeHtml(e.message)}</div>`;
  }
}
window.psyRunFresh = psyRunFresh;

async function analyzeAllFiles(userId){
  if(!userId) return;
  if(!confirm('تحلیل همه فایل‌های این کاربر در پس‌زمینه شروع شود؟')) return;
  try{
    const r = await fetch(`/api/user/${userId}/analyze-files/`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
      body: JSON.stringify({force: false})
    });
    const d = await r.json();
    if(d.success){
      alert(` تحلیل ${d.file_count} فایل شروع شد (task: ${d.task_id.slice(0,8)})`);
    }else{
      alert(' ' + (d.msg || 'خطا'));
    }
  }catch(e){
    alert(' خطای شبکه');
  }
}
window.analyzeAllFiles = analyzeAllFiles;

/* ═══════ Init ═══════ */
loadUsers();
</script>
