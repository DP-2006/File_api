{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F" id="themeColor">
<title>گزارشات هوش مصنوعی — داشبورد تحلیل</title>

<script>
  (function(){
    var t; try{ t = localStorage.getItem('theme'); }catch(e){}
    if(!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
<script src="{% static 'vendor/chartjs/chart.umd.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'vendor/vazirmatn/vazirmatn.css' %}">

<style>
  /* ───────── Design Tokens ───────── */
  :root, [data-theme="dark"]{
    color-scheme: dark;
    --bg: #0B0B0F;
    --bg-elev: #131318;
    --bg-elev-2: #1A1A21;
    --bg-hover: #1F1F27;
    --border: #26262F;
    --border-strong: #32323D;

    --text: #EDEDF0;
    --text-2: #A0A0AC;
    --text-3: #6B6B78;

    --accent: #6366F1;
    --accent-hover: #7C7FF5;
    --accent-soft: rgba(99,102,241,.14);

    --green: #22C55E;
    --green-soft: rgba(34,197,94,.14);
    --red: #EF4444;
    --red-soft: rgba(239,68,68,.14);
    --orange: #F59E0B;
    --orange-soft: rgba(245,158,11,.14);
    --blue: #3B82F6;
    --blue-soft: rgba(59,130,246,.14);
    --purple: #A855F7;
    --purple-soft: rgba(168,85,247,.14);
    --teal: #14B8A6;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 4px 16px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.5);

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-xl: 20px;
    --ease: cubic-bezier(.4,0,.2,1);
  }

  [data-theme="light"]{
    color-scheme: light;
    --bg: #F7F7F9;
    --bg-elev: #FFFFFF;
    --bg-elev-2: #FAFAFC;
    --bg-hover: #F0F0F4;
    --border: #E5E5EA;
    --border-strong: #D5D5DD;

    --text: #18181B;
    --text-2: #52525B;
    --text-3: #8A8A94;

    --accent: #4F46E5;
    --accent-hover: #4338CA;
    --accent-soft: rgba(79,70,229,.08);

    --green: #16A34A;
    --green-soft: rgba(22,163,74,.1);
    --red: #DC2626;
    --red-soft: rgba(220,38,38,.1);
    --orange: #D97706;
    --orange-soft: rgba(217,119,6,.1);
    --blue: #2563EB;
    --blue-soft: rgba(37,99,235,.1);
    --purple: #9333EA;
    --purple-soft: rgba(147,51,234,.1);
    --teal: #0D9488;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow-md: 0 4px 16px rgba(0,0,0,.06);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.08);
  }

  /* ───────── Reset ───────── */
  *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; min-height:100dvh;
    font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    transition: background .3s var(--ease), color .3s var(--ease);
  }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input, select{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--text-3); }

  /* ───────── App Shell ───────── */
  .app{
    display:grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    height:100vh; height:100dvh;
  }

  /* ───────── Header ───────── */
  .header{
    grid-area: header;
    display:flex; align-items:center; gap:16px;
    padding:0 20px;
    background:var(--bg-elev);
    border-bottom:1px solid var(--border);
    z-index:20;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:700; font-size:15px; white-space:nowrap;
  }
  .brand-mark{
    width:28px; height:28px; border-radius:8px;
    background:linear-gradient(135deg, var(--accent), var(--purple));
    display:grid; place-items:center; color:#fff; font-size:14px; font-weight:800;
  }
  .header-divider{ width:1px; height:20px; background:var(--border); }
  .breadcrumb{
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:var(--text-2);
  }
  .breadcrumb a{ color:var(--text-2); text-decoration:none; }
  .breadcrumb a:hover{ color:var(--text); }
  .breadcrumb .sep{ color:var(--text-3); }
  .breadcrumb .current{ color:var(--text); font-weight:500; }

  /* نام کاربر در هدر (جایگزین نوار بزرگ) */
  .header-user{
    display:none;
    align-items:center; gap:8px;
    padding:4px 10px 4px 4px;
    border-radius:999px;
    background:var(--bg-elev-2);
    border:1px solid var(--border);
  }
  .header-user.visible{ display:inline-flex; }
  .header-user .avatar{
    width:26px; height:26px; font-size:11px;
  }
  .header-user .hu-name{
    font-size:13px; font-weight:600;
    max-width:140px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .header-actions{
    margin-inline-start:auto;
    display:flex; align-items:center; gap:8px;
  }
  .live-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 10px; border-radius:999px;
    font-size:12px; font-weight:600;
    background:var(--green-soft); color:var(--green);
  }
  .live-badge .dot{
    width:6px; height:6px; border-radius:50%; background:var(--green);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(34,197,94,.6); }
    100%{ box-shadow:0 0 0 8px rgba(34,197,94,0); }
  }

  .icon-btn{
    width:34px; height:34px; border-radius:8px;
    display:inline-grid; place-items:center;
    color:var(--text-2);
    transition: background .15s, color .15s;
  }
  .icon-btn:hover{ background:var(--bg-hover); color:var(--text); }
  .icon-btn.spinning svg{ animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .theme-btn .sun{ display:none; }
  [data-theme="light"] .theme-btn .sun{ display:block; }
  [data-theme="light"] .theme-btn .moon{ display:none; }

  /* ───────── Sidebar ───────── */
  .sidebar{
    grid-area: sidebar;
    background:var(--bg-elev);
    border-inline-end:1px solid var(--border);
    display:flex; flex-direction:column;
    min-height:0;
  }
  .sidebar-head{
    padding:16px 16px 12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .sidebar-title{
    font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:.05em; color:var(--text-3);
  }
  .count-badge{
    font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent);
  }
  .search-wrap{
    padding:0 12px 12px;
  }
  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--r-md);
    padding:7px 10px;
    transition: border-color .15s, background .15s;
  }
  .search:focus-within{ border-color:var(--accent); background:var(--bg-elev); }
  .search svg{ color:var(--text-3); flex-shrink:0; }
  .search input{
    flex:1; min-width:0;
    background:none; border:none; outline:none;
    color:var(--text); font-size:13px;
  }
  .search input::placeholder{ color:var(--text-3); }

  .user-list{
    flex:1; overflow-y:auto;
    padding:0 8px 12px;
  }
  .user-item{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:9px 10px; border-radius:var(--r-md);
    text-align:right; color:var(--text);
    transition: background .12s;
    border:1px solid transparent;
  }
  .user-item:hover{ background:var(--bg-hover); }
  .user-item.active{
    background:var(--accent-soft);
    border-color:rgba(99,102,241,.3);
  }
  .avatar{
    width:36px; height:36px; border-radius:50%;
    flex-shrink:0;
    display:grid; place-items:center;
    font-size:14px; font-weight:700; color:#fff;
  }
  .avatar.lg{ width:56px; height:56px; font-size:22px; }
  .u-info{ flex:1; min-width:0; }
  .u-name{
    display:block; font-size:13px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .u-stats{
    display:block; font-size:11px; color:var(--text-3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ───────── Main ───────── */
  .main{
    grid-area: main;
    overflow-y:auto;
    background:var(--bg);
  }
  .main-inner{
    max-width:1280px; margin:0 auto;
    padding:24px;
  }

  /* ─── کارت واحد آمار (ادغام KPI ها) ─── */
  .stats-card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:14px 16px;
    margin-bottom:18px;
    box-shadow:var(--shadow-sm);
  }
  .stats-card-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .stats-card-title{
    font-size:12px; font-weight:600;
    color:var(--text-3);
    text-transform:uppercase; letter-spacing:.05em;
  }
  .stats-actions{
    display:flex; gap:6px;
  }
  .stats-add-btn{
    display:inline-flex; align-items:center; gap:4px;
    padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:600;
    background:var(--accent-soft); color:var(--accent);
    border:1px solid transparent;
    transition: all .15s;
  }
  .stats-add-btn:hover{ background:var(--accent); color:#fff; }

  .stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(110px, 1fr));
    gap:0;
    border-radius:var(--r-md);
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--bg-elev-2);
  }
  .stat-cell{
    padding:10px 12px;
    text-align:center;
    border-inline-end:1px solid var(--border);
    position:relative;
    transition: background .15s;
  }
  .stat-cell:last-child{ border-inline-end:none; }
  .stat-cell:hover{ background:var(--bg-hover); }
  .stat-cell .sv{
    font-size:20px; font-weight:700; line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .stat-cell .sl{
    font-size:11px; color:var(--text-3);
    margin-top:3px;
    white-space:nowrap;
  }
  .stat-cell.blue .sv{ color:var(--blue); }
  .stat-cell.green .sv{ color:var(--green); }
  .stat-cell.red .sv{ color:var(--red); }
  .stat-cell.orange .sv{ color:var(--orange); }
  .stat-cell.purple .sv{ color:var(--purple); }
  .stat-cell.teal .sv{ color:var(--teal); }

  /* کارت های سفارشی */
  .custom-stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:10px;
    margin-top:12px;
  }
  .custom-stat{
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    border-radius:var(--r-md);
    padding:12px 14px;
    position:relative;
    animation:fadeIn .25s var(--ease);
  }
  .custom-stat .cs-label{
    font-size:11px; color:var(--text-3);
    margin-bottom:4px;
    display:flex; align-items:center; justify-content:space-between;
    gap:6px;
  }
  .custom-stat .cs-label .rm{
    width:18px; height:18px; border-radius:4px;
    display:grid; place-items:center;
    color:var(--text-3); font-size:12px;
    opacity:0; transition: opacity .15s, background .15s;
  }
  .custom-stat:hover .cs-label .rm{ opacity:1; }
  .custom-stat .cs-label .rm:hover{ background:var(--red-soft); color:var(--red); }
  .custom-stat .cs-value{
    font-size:22px; font-weight:700;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .custom-stat .cs-formula{
    font-size:10px; color:var(--text-3);
    margin-top:2px;
    direction:ltr; text-align:right;
  }

  /* فرم ساخت کارت سفارشی */
  .custom-stat-form{
    margin-top:12px;
    padding:12px 14px;
    background:var(--bg-elev-2);
    border:1px dashed var(--border-strong);
    border-radius:var(--r-md);
    display:grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap:8px;
    align-items:end;
    animation:fadeIn .2s var(--ease);
  }
  .custom-stat-form label{
    display:block;
    font-size:11px; color:var(--text-3);
    margin-bottom:4px;
  }
  .custom-stat-form input,
  .custom-stat-form select{
    width:100%;
    padding:6px 10px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--text);
    font-size:12px;
    outline:none;
    transition: border-color .15s;
  }
  .custom-stat-form input:focus,
  .custom-stat-form select:focus{ border-color:var(--accent); }
  .custom-stat-form .form-actions{
    display:flex; gap:6px;
  }
  .custom-stat-form .btn-sm{
    padding:6px 12px; border-radius:6px;
    font-size:11px; font-weight:600;
    background:var(--accent); color:#fff;
    border:none;
    transition: background .15s;
  }
  .custom-stat-form .btn-sm:hover{ background:var(--accent-hover); }
  .custom-stat-form .btn-sm.secondary{
    background:var(--bg); color:var(--text-2);
    border:1px solid var(--border);
  }
  .custom-stat-form .btn-sm.secondary:hover{ background:var(--bg-hover); color:var(--text); }

  @media (max-width: 700px){
    .custom-stat-form{ grid-template-columns:1fr 1fr; }
    .custom-stat-form .form-actions{ grid-column:1 / -1; }
  }

  /* Tabs */
  .tabs{
    display:flex; gap:4px;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
    overflow-x:auto;
  }
  .tab{
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 14px;
    font-size:13px; font-weight:500;
    color:var(--text-2);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    white-space:nowrap;
    transition: color .15s, border-color .15s;
  }
  .tab:hover{ color:var(--text); }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

  .tab-panel{ display:none; animation:fadeIn .25s var(--ease); }
  .tab-panel.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* Charts */
  .charts-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:16px;
  }
  .chart-card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:16px;
    height:320px;
    display:flex; flex-direction:column;
  }
  .chart-card.wide{ grid-column:1 / -1; height:300px; }
  .chart-card h4{
    font-size:13px; font-weight:600; color:var(--text-2);
    margin-bottom:12px;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
  }
  .chart-card h4 .hint{
    font-size:11px; font-weight:400;
    color:var(--text-3);
  }
  .chart-body{ flex:1; min-height:0; position:relative; }
  .no-data{
    display:grid; place-items:center; height:100%;
    color:var(--text-3); font-size:13px;
  }
  .chart-canvas.clickable{ cursor:pointer; }

  /* جزئیات موضوع (بعد از کلیک روی نمودار) */
  .topic-detail{
    margin-top:12px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:16px;
    animation:fadeIn .25s var(--ease);
  }
  .topic-detail-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:12px;
  }
  .topic-detail-title{
    display:flex; align-items:center; gap:10px;
    font-size:14px; font-weight:600;
  }
  .topic-detail-title .dot{
    width:10px; height:10px; border-radius:50%;
  }
  .topic-detail-close{
    width:28px; height:28px; border-radius:6px;
    display:grid; place-items:center;
    color:var(--text-3);
    transition: background .15s, color .15s;
  }
  .topic-detail-close:hover{ background:var(--bg-hover); color:var(--text); }
  .topic-detail-stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:8px;
    margin-bottom:12px;
  }
  .topic-detail-stat{
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    border-radius:var(--r-md);
    padding:10px 12px;
    text-align:center;
  }
  .topic-detail-stat .lbl{
    font-size:11px; color:var(--text-3); margin-bottom:2px;
  }
  .topic-detail-stat .val{
    font-size:16px; font-weight:700;
  }
  .topic-files-list{
    max-height:220px; overflow-y:auto;
    border:1px solid var(--border);
    border-radius:var(--r-md);
  }
  .topic-file-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 12px;
    border-bottom:1px solid var(--border);
    font-size:12px;
  }
  .topic-file-row:last-child{ border-bottom:none; }
  .topic-file-row .name{
    flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--text);
  }
  .topic-file-row .score{
    font-weight:700; color:var(--teal);
    font-variant-numeric:tabular-nums;
    font-size:11px;
  }

  /* Filter chips */
  .filter-row{
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;
  }
  .chip{
    padding:6px 14px; border-radius:999px;
    font-size:12px; font-weight:500;
    color:var(--text-2);
    background:var(--bg-elev);
    border:1px solid var(--border);
    transition: all .15s;
  }
  .chip:hover{ border-color:var(--border-strong); color:var(--text); }
  .chip.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }

  /* File table */
  .file-table-wrap{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    overflow:hidden;
  }
  .file-table{
    width:100%; border-collapse:collapse;
    font-size:13px;
  }
  .file-table thead{ background:var(--bg-elev-2); }
  .file-table th{
    text-align:right; padding:10px 14px;
    font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.03em; color:var(--text-3);
    border-bottom:1px solid var(--border);
  }
  .file-table td{
    padding:12px 14px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  .file-table tbody tr:last-child td{ border-bottom:none; }
  .file-table tbody tr:hover{ background:var(--bg-hover); }
  .file-name-cell{
    max-width:280px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-weight:500;
  }
  .file-name-cell .sub{
    display:block; font-size:11px; color:var(--text-3); font-weight:400;
    direction:ltr; text-align:right;
  }
  .pill{
    display:inline-block;
    padding:2px 9px; border-radius:999px;
    font-size:11px; font-weight:600;
    white-space:nowrap;
    margin-inline-end:4px;
  }
  .pill.rel{ background:var(--green-soft); color:var(--green); }
  .pill.unrel{ background:var(--red-soft); color:var(--red); }
  .pill.t-low{ background:var(--green-soft); color:var(--green); }
  .pill.t-medium{ background:var(--orange-soft); color:var(--orange); }
  .pill.t-high, .pill.t-critical{ background:var(--red-soft); color:var(--red); }
  .pill.t-unknown{ background:var(--bg-hover); color:var(--text-3); }

  .score-cell{ min-width:100px; }
  .score-val{
    font-size:12px; font-weight:700; color:var(--teal);
    font-variant-numeric:tabular-nums;
  }
  .score-bar{
    height:4px; border-radius:4px;
    background:var(--border);
    margin-top:4px; overflow:hidden;
  }
  .score-bar i{
    display:block; height:100%; border-radius:4px;
    background:linear-gradient(90deg, var(--teal), var(--blue));
    transition: width .8s var(--ease);
    width:0;
  }

  /* Chat */
  .chat-wrap{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .chat-toolbar{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    background:var(--bg-elev-2);
  }
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:var(--r-md);
    font-size:12px; font-weight:600;
    border:1px solid var(--border);
    background:var(--bg-elev);
    color:var(--text);
    transition: all .15s;
  }
  .btn:hover:not(:disabled){ background:var(--bg-hover); border-color:var(--border-strong); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  .btn-primary:hover:not(:disabled){ background:var(--accent-hover); border-color:var(--accent-hover); }
  .chat-toolbar input[type="text"]{
    flex:1; min-width:140px;
    padding:7px 12px; border-radius:var(--r-md);
    background:var(--bg); border:1px solid var(--border);
    color:var(--text); font-size:12px; outline:none;
    transition: border-color .15s;
  }
  .chat-toolbar input[type="text"]:focus{ border-color:var(--accent); }

  .chat-status{
    font-size:11px; color:var(--text-3);
    padding:0 4px;
  }

  .chat-messages{
    flex:1; min-height:280px; max-height:480px;
    overflow-y:auto;
    padding:16px;
    background:var(--bg);
  }
  .chat-empty{
    display:grid; place-items:center; text-align:center;
    height:100%; color:var(--text-3); font-size:13px;
    gap:8px; padding:40px 20px;
  }
  .chat-empty .icon{ font-size:32px; }

  .chat-msg{
    display:flex; gap:10px; margin-bottom:14px;
    animation: fadeIn .25s var(--ease);
  }
  .chat-msg.user{ flex-direction:row-reverse; }
  .chat-avatar{
    width:28px; height:28px; border-radius:50%;
    flex-shrink:0;
    display:grid; place-items:center;
    font-size:13px;
    background:var(--bg-elev-2);
    border:1px solid var(--border);
  }
  .chat-bubble{
    max-width:75%;
    padding:10px 14px;
    border-radius:var(--r-md);
    font-size:13px; line-height:1.8;
    white-space:pre-wrap; word-break:break-word;
  }
  .chat-msg.user .chat-bubble{
    background:var(--accent); color:#fff;
    border-top-left-radius:4px;
  }
  .chat-msg.assistant .chat-bubble{
    background:var(--bg-elev-2); color:var(--text);
    border:1px solid var(--border);
    border-top-right-radius:4px;
  }
  .chat-typing{
    display:inline-flex; gap:4px; padding:4px 0;
  }
  .chat-typing i{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-3);
    animation: blink 1.2s infinite;
  }
  .chat-typing i:nth-child(2){ animation-delay:.2s; }
  .chat-typing i:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }

  .chat-image-result{
    padding:12px 16px;
    border-top:1px solid var(--border);
    background:var(--bg-elev-2);
  }
  .chat-image-result img{
    max-width:100%; max-height:420px;
    border-radius:var(--r-md);
    display:block; margin-bottom:8px;
    border:1px solid var(--border);
  }
  .chat-image-result .caption{
    font-size:11px; color:var(--text-3);
    direction:ltr; text-align:right;
  }

  .chat-input-row{
    display:flex; gap:8px;
    padding:12px 16px;
    border-top:1px solid var(--border);
    background:var(--bg-elev-2);
  }
  .chat-input-row input{
    flex:1; min-width:0;
    padding:9px 14px; border-radius:var(--r-md);
    background:var(--bg); border:1px solid var(--border);
    color:var(--text); font-size:13px; outline:none;
    transition: border-color .15s;
  }
  .chat-input-row input:focus{ border-color:var(--accent); }
  .chat-input-row input:disabled{ opacity:.5; }

  /* Psychology */
  .psy-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-bottom:16px;
  }
  .psy-header h3{ font-size:15px; font-weight:600; }
  .psy-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .psy-scores{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:12px; margin-bottom:16px;
  }
  .psy-score{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:14px 16px;
    text-align:center;
  }
  .psy-score .label{
    font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.04em; color:var(--text-3);
    margin-bottom:6px;
  }
  .psy-score .value{
    font-size:22px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .psy-narrative{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:16px 18px;
    font-size:13px; line-height:1.9; color:var(--text);
    white-space:pre-wrap;
  }
  .psy-signals{
    margin-top:12px;
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .psy-signal{
    font-size:11px;
    padding:3px 10px; border-radius:999px;
    background:var(--bg-elev-2); color:var(--text-2);
    border:1px solid var(--border);
  }

  /* States */
  .spinner{
    width:28px; height:28px;
    border:2.5px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation: spin .8s linear infinite;
    margin:40px auto;
  }
  .empty-block{
    display:grid; place-items:center; text-align:center;
    padding:60px 24px; color:var(--text-2);
    gap:8px;
  }
  .empty-block .icon{ font-size:40px; }
  .empty-block h3{ font-size:16px; color:var(--text); font-weight:600; }
  .empty-block p{ font-size:13px; color:var(--text-3); }

  .error-box{
    background:var(--red-soft);
    border:1px solid rgba(239,68,68,.3);
    color:var(--red);
    padding:12px 16px; border-radius:var(--r-md);
    font-size:13px;
  }

  /* Responsive */
  @media (max-width:960px){
    .app{
      grid-template-columns:1fr;
      grid-template-rows: 56px auto 1fr;
      grid-template-areas:
        "header"
        "sidebar"
        "main";
      height:auto; min-height:100dvh;
    }
    .sidebar{
      border-inline-end:none;
      border-bottom:1px solid var(--border);
      max-height:340px;
    }
    .user-list{ max-height:240px; }
    .charts-grid{ grid-template-columns:1fr; }
    .main-inner{ padding:16px; }
    .file-table th:nth-child(3),
    .file-table td:nth-child(3){ display:none; }
    .stats-grid{ grid-template-columns:repeat(auto-fit, minmax(80px,1fr)); }
    .stat-cell{ padding:8px 6px; }
    .stat-cell .sv{ font-size:16px; }
    .stat-cell .sl{ font-size:10px; }
  }

  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important;
      transition-duration:.01ms !important;
    }
  }
  canvas { font-family: Tahoma, sans-serif !important; }
</style>
</head>
<body>

<div class="app">

        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="بازخوانی" aria-label="بازخوانی">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>

  <!-- ══════ SIDEBAR ══════ -->

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="جستجوی کاربر...">

      <div class="spinner"></div>

  <!-- ══════ MAIN ══════ -->
  <main class="main" id="mainArea">
    <div class="main-inner">
      <div class="empty-block" style="background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-xl)">
        <span class="icon">📊</span>
        <h3>داشبورد تحلیل رفتار</h3>
        <p>برای مشاهده گزارش، یک کاربر را از لیست سمت راست انتخاب کنید</p>
      </div>
    </div>
  </main>

</div>

<script>
/* ═══════════ Helpers ═══════════ */
function getCsrfToken(){
  const m = document.cookie.match(/csrftoken=([^;]+)/);
  return m ? m[1] : '';
}
const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const fmtTime = s => s ? escapeHtml(String(s).replace('T',' ').slice(0,16)) : '—';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const AVATAR_GRADS = [
  'linear-gradient(135deg,#6366F1,#8B5CF6)',
  'linear-gradient(135deg,#22C55E,#14B8A6)',
  'linear-gradient(135deg,#F59E0B,#EF4444)',
  'linear-gradient(135deg,#A855F7,#EC4899)',
  'linear-gradient(135deg,#3B82F6,#06B6D4)',
  'linear-gradient(135deg,#EF4444,#F59E0B)'
];
const avatarBg = id => AVATAR_GRADS[Math.abs(num(id)) % AVATAR_GRADS.length];
const initial = n => escapeHtml((n||'?').trim().charAt(0).toUpperCase());

const THREAT = {
  low:{t:'تهدید: کم',c:'t-low'},
  medium:{t:'تهدید: متوسط',c:'t-medium'},
  high:{t:'تهدید: بالا',c:'t-high'},
  critical:{t:'تهدید: بحرانی',c:'t-critical'}
};
const threatPill = lvl => {
  const m = THREAT[String(lvl||'').toLowerCase()] || {t:escapeHtml(lvl||'—'),c:'t-unknown'};
  return `<span class="pill ${m.c}">${m.t}</span>`;
};

async function getJSON(url){
  const r = await fetch(url, {headers:{'Accept':'application/json'}, credentials:'same-origin'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function countUp(el){
  const end = parseFloat(el.dataset.count);
  const dec = parseInt(el.dataset.dec || 0);
  const t0 = performance.now();
  const dur = 900;
  const fmt = v => dec ? toFa(v.toFixed(dec)) : toFa(Math.round(v));
  (function tick(t){
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(end * e);
    if(p < 1) requestAnimationFrame(tick);
  })(t0);
}

/* ═══════════ Theme ═══════════ */
function applyThemeMeta(){
  document.getElementById('themeColor').content =
    document.documentElement.dataset.theme === 'light' ? '#F7F7F9' : '#0B0B0F';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  const swap = () => {
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem('theme', next); }catch(e){}
    applyThemeMeta();
    if(lastData && document.getElementById('chartTopics')) buildCharts(lastData);
    if(activeTopicName) showTopicDetail(activeTopicName);
  };
  document.startViewTransition ? document.startViewTransition(swap) : swap();
});
applyThemeMeta();

/* ═══════════ Chart.js ═══════════ */
Chart.defaults.font.family = 'Segoe UI, Arial, sans-serif';
Chart.defaults.color = css('--text-2');
const PALETTE = () => [
  css('--accent'), css('--green'), css('--orange'), css('--red'),
  css('--purple'), css('--teal'), css('--blue'), css('--text-3')
];

const tooltipCfg = () => ({
  backgroundColor: css('--bg-elev'),
  borderColor: css('--border'),
  borderWidth: 1,
  titleColor: css('--text'),
  bodyColor: css('--text-2'),
  padding: 10,
  cornerRadius: 8,
  displayColors: false,
  rtl: true,
  textDirection: 'rtl',
  titleFont: { weight:'700', size:12 },
  bodyFont: { size:12 },
  callbacks: { label: c => c.formattedValue }
});

const hexA = (hex, a) => {
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.replace(/./g,'$&$&') : h, 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
};
const vGrad = (hex, a0=1, a1=.3) => ctx => {
  const a = ctx.chart.chartArea; if(!a) return hex;
  const g = ctx.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
  g.addColorStop(0, hexA(hex, a0));
  g.addColorStop(1, hexA(hex, a1));
  return g;
};

const centerText = {
  id:'centerText',
  afterDraw(c, _, o){
      if (c.config.type !== 'doughnut' || !o.text) return;
    if(c.config.type !== 'doughnut' || !o.text) return;
    const {ctx, chartArea:a} = c;
    const x = (a.left+a.right)/2, y = (a.top+a.bottom)/2;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = css('--text');
    ctx.font = '700 24px Vazirmatn, sans-serif';
    ctx.fillText(o.text, x, y - 6);
    ctx.fillStyle = css('--text-3');
    ctx.font = '500 11px Vazirmatn, sans-serif';
    ctx.fillText(o.sub, x, y + 16);
    ctx.restore();
  }
};

let charts = {};
let activeTopicName = null;

function destroyCharts(){
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

function tooltip(){
  return {
    backgroundColor: css('--tip'),
    borderColor: css('--separator'),
    borderWidth: 1,
    titleColor: css('--label'),
    bodyColor: css('--label-2'),
    padding: 12,
    cornerRadius: 12,
    displayColors: false,
    rtl: true,
    textDirection: 'rtl',
    titleFont: {weight: '700', family: 'Vazirmatn'},
    bodyFont: {size: 12, family: 'Vazirmatn'},
    callbacks: { label: c => c.formattedValue }
  };
}

function buildCharts(d){
  destroyCharts();
  const trend = d.trend || [];
  const kindDist = d.kind_distribution || {};
  const matrix = d.matrix_2x2 || {org_related:0, org_unrelated:0, nonorg_related:0, nonorg_unrelated:0};
  const topicDist = d.topic_distribution || [];

  const txt = css('--label-2'), grid = css('--separator'), P = PALETTE();
  const base = {responsive:true, maintainAspectRatio:false};

  /* 1) Doughnut: ????? ??? ???? */
  const cK = document.getElementById('chartKinds');
  if (cK) {
    let labels = Object.keys(kindDist);
    let values = Object.values(kindDist);
    if (!labels.length) { labels = ['No data']; values = [1]; }
    const total = values.reduce((s,v) => s + v, 0);
    if (labels.length) {
      charts.kinds = new Chart(cK, {
        type: 'doughnut',
        data: { labels,
          datasets: [{ data: values, backgroundColor: labels.map((_,i) => P[i % P.length]),
            borderWidth: 0, hoverOffset: 10, spacing: 3, borderRadius: 8 }] },
        options: { ...base, cutout: '68%',
          animation: { animateRotate: true, animateScale: true, duration: 1400 },
          plugins: { centerText: {text: total, sub: 'Files'},
            tooltip: tooltip(),
            legend: { position: 'bottom', labels: {usePointStyle: true, pointStyle: 'circle', boxWidth: 8, padding: 12, color: txt, font: {size: 12, family: 'Tahoma, Vazirmatn'}} } } },
        plugins: [centerText]
      });
    }
  }

  /* 2) Doughnut: ?????? ??? */
  const cM = document.getElementById('chartMatrix');
  if (cM) {
    const labels = ['Org Related', 'Org Unrelated', 'Non-Org Related', 'Non-Org Unrelated'];
    let values = [matrix.org_related, matrix.org_unrelated, matrix.nonorg_related, matrix.nonorg_unrelated];
    if (values.every(v => v === 0)) { values = [0, 0, 0, 0]; }
    const colors = [css('--green'), css('--orange'), css('--teal'), css('--red')];
    const total = values.reduce((s,v) => s + v, 0);
    charts.matrix = new Chart(cM, {
      type: 'doughnut',
      data: { labels,
        datasets: [{ data: values, backgroundColor: colors,
          borderWidth: 0, hoverOffset: 10, spacing: 3, borderRadius: 8 }] },
      options: { ...base, cutout: '65%',
        animation: { animateRotate: true, animateScale: true, duration: 1400 },
        plugins: { centerText: {text: total, sub: 'Files'},
          tooltip: tooltip(),
          legend: { position: 'bottom', labels: {usePointStyle: true, pointStyle: 'circle', boxWidth: 8, padding: 10, color: txt, font: {size: 10, family: 'Segoe UI, Arial'}} } } },
      plugins: [centerText]
    });
  }

  /* 3) Dual-axis: ???? ?????? + ?????? ??? */
  const cR = document.getElementById('chartTrend');
  if (cR) {
    const labels = trend.length ? trend.map(t => t.date) : ['No data'];
    charts.trend = new Chart(cR, {
      type: 'bar',
      data: { labels,
        datasets: [
          { type:'bar', label: 'Total Uploads', data: trend.map(t => t.total),
            backgroundColor: vGrad(css('--blue'), .8, .35), borderRadius: 8,
            borderSkipped: false, categoryPercentage: .65, barPercentage: .8, yAxisID: 'y' },
          { type:'bar', label: 'Org Files', data: trend.map(t => t.org || 0),
            backgroundColor: vGrad(css('--green'), .8, .35), borderRadius: 8,
            borderSkipped: false, categoryPercentage: .65, barPercentage: .8, yAxisID: 'y' },
          { type:'line', label: 'Avg Role Relevance',
            data: trend.map(t => t.avg_relevance || 0),
            borderColor: css('--purple'), backgroundColor: 'transparent',
            borderWidth: 3, tension: .35, pointRadius: 4, pointHoverRadius: 7,
            pointBackgroundColor: css('--purple'), pointBorderColor: '#fff', pointBorderWidth: 2,
            yAxisID: 'y1' },
        ] },
      options: { ...base, interaction: {mode:'index', intersect:false},
        plugins: { legend: {display:true, position:'bottom',
          labels:{usePointStyle:true, pointStyle:'circle', boxWidth:8, padding:12, color:txt, font: {size: 11, family: 'Segoe UI, Arial'}}},
          tooltip: tooltip() },
        scales: {
          x: {grid:{display:false}, border:{display:false}, ticks:{color:txt, maxTicksLimit:8}},
          y: {beginAtZero:true, position:'left', grid:{color:grid}, border:{display:false},
              ticks:{precision:0, color:txt, callback:v => toFa(v)}},
          y1: {beginAtZero:true, max:1, position:'right', grid:{display:false}, border:{display:false},
               ticks:{color:css('--purple'), callback:v => toFa(v.toFixed(2))}}
        } }
    });
  }

  /* 4) Doughnut: ??????? ?? drilldown */
  const cTo = document.getElementById('chartTopics');
  if (cTo) {
    if (topicDist.length) {
      const topN = topicDist.slice(0, 10);
      const total = topN.reduce((s,t) => s + (t.count || 0), 0);
      charts.topics = new Chart(cTo, {
        type: 'doughnut',
        data: { labels: topN.map(t => t.name),
          datasets: [{ data: topN.map(t => t.count),
            backgroundColor: topN.map((_,i) => P[i % P.length]),
            borderWidth: 0, hoverOffset: 12, spacing: 3, borderRadius: 8 }] },
        options: { ...base, cutout: '65%',
          onClick: (evt, els) => {
            if (!els.length) return;
            const idx = els[0].index;
            const topic = topN[idx];
            if (topic && topic.files) showTopicDrilldown(topic.name, topic.files);
          },
          animation: { animateRotate: true, animateScale: true, duration: 1400 },
          plugins: { centerText: {text: total, sub: 'Topics'},
            tooltip: tooltip(),
            legend: { position: 'bottom', labels: {usePointStyle: true, pointStyle: 'circle', boxWidth: 8, padding: 10, color: txt, font: {size: 10, family: 'Segoe UI, Arial'}} } } },
        plugins: [centerText]
      });
    }
  }
}

function showTopicDrilldown(topicName, files) {

  const unrelatedCount = total - relatedCount;

  const modal = document.createElement('div');
  modal.id = 'topicDrillModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Segoe UI, Arial, sans-serif';

      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">' +

        '<div style="background:rgba(255,255,255,.06);border-radius:16px;padding:12px;height:200px;position:relative"><canvas id="drillRelChart"></canvas></div>' +
      '</div>' +
      '<div style="background:rgba(255,255,255,.06);border-radius:16px;padding:16px">' +
        '<div style="font-size:13px;color:rgba(255,255,255,.7);margin-bottom:10px">Files (' + total + ')</div>' +
        files.map(function(f) {
          const name = String(f.file_name || '?');
          const kind = String(f.kind || '?');
          const org = f.is_org ? 'ORG' : 'NON-ORG';

            '</div>';
        }).join('') +
      '</div>' +

  document.body.appendChild(modal);
  document.getElementById('topicDrillClose').onclick = function() { modal.remove(); };

  // Org vs Non-Org doughnut
  new Chart(document.getElementById('drillOrgChart'), {
    type: 'doughnut',
    data: { labels: ['Org', 'Non-Org'], datasets: [{ data: [orgCount, nonorgCount],
      backgroundColor: ['#30D158', '#FF9F0A'], borderWidth: 0, hoverOffset: 8 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout: '65%',
      plugins: { legend: { position: 'bottom', labels: { color: '#fff', font: {size:11, family:'Segoe UI, Arial'}, usePointStyle:true, pointStyle:'circle', boxWidth:8 } } } }
  });

  // Related vs Unrelated doughnut
  new Chart(document.getElementById('drillRelChart'), {
    type: 'doughnut',
    data: { labels: ['Related', 'Unrelated'], datasets: [{ data: [relatedCount, unrelatedCount],
      backgroundColor: ['#0A84FF', '#FF453A'], borderWidth: 0, hoverOffset: 8 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout: '65%',
      plugins: { legend: { position: 'bottom', labels: { color: '#fff', font: {size:11, family:'Segoe UI, Arial'}, usePointStyle:true, pointStyle:'circle', boxWidth:8 } } } }

/* ═══════════ State ═══════════ */
let currentUserId = null;
let currentTab = 'overview';
let currentFilter = 'all';
let usersCache = [];
let lastSig = '';
let lastData = null;
let reqSeq = 0;
let usersSig = '';

/* ═══════════ Custom Stats (ذخیره در localStorage) ═══════════ */
const CUSTOM_STATS_KEY = 'ai_report_custom_stats_v1';
function loadCustomStats(userId){
  try{
    const all = JSON.parse(localStorage.getItem(CUSTOM_STATS_KEY) || '{}');
    return all[String(userId)] || [];
  }catch(e){ return []; }
}
function saveCustomStats(userId, list){
  try{
    const all = JSON.parse(localStorage.getItem(CUSTOM_STATS_KEY) || '{}');
    all[String(userId)] = list;
    localStorage.setItem(CUSTOM_STATS_KEY, JSON.stringify(all));
  }catch(e){}
}

/* فرمول‌های موجود برای کارت سفارشی */
const STAT_FORMULAS = {
  total:       { label:'کل فایل‌ها',           fn: b => num(b.total_files) },
  related:     { label:'فایل‌های مرتبط',       fn: b => num(b.related_files_count) },
  unrelated:   { label:'فایل‌های غیرمرتبط',     fn: b => num(b.unrelated_files_count) },
  suspicious:  { label:'فایل‌های مشکوک',       fn: b => num(b.suspicious_files_count) },
  relevance:   { label:'میانگین relevance',    fn: b => num(b.relevance_avg), dec:2 },
  related_pct: { label:'درصد مرتبط',           fn: b => {
    const t = num(b.total_files); return t ? num(b.related_files_count) / t * 100 : 0;
  }, dec:1, suffix:'٪' },
  susp_pct:    { label:'درصد مشکوک',           fn: b => {
    const t = num(b.total_files); return t ? num(b.suspicious_files_count) / t * 100 : 0;
  }, dec:1, suffix:'٪' },
  topics_count:{ label:'تعداد موضوعات',        fn: b => (b.top_topics||[]).length },
};

function evaluateCustomStat(stat, behavior){
  const f = STAT_FORMULAS[stat.formula];
  if(!f) return { value:'—', suffix:'' };
  const v = f.fn(behavior);
  const dec = f.dec || 0;
  return {
    value: dec ? toFa(v.toFixed(dec)) : toFa(Math.round(v)),
    suffix: f.suffix || ''
  };
}

/* ═══════════ Users sidebar ═══════════ */
async function loadUsers(){
  const list = document.getElementById('usersList');
  if(!usersCache.length) list.innerHTML = '<div class="spinner"></div>';
  try{
    const d = await getJSON('/api/behavior-analysis/');
    if(!d.success || !d.items || !d.items.length){
      usersCache = [];
      list.innerHTML = '<div class="empty-block"><span class="icon">🫥</span><h3>هیچ کاربری</h3><p>هنوز تحلیلی انجام نشده</p></div>';
      document.getElementById('userCount').textContent = '۰';
      return;
    }
    const sig = JSON.stringify(d.items);
    if(sig === usersSig) return;
    usersSig = sig;
    usersCache = d.items;
    document.getElementById('userCount').textContent = toFa(d.items.length);
    filterUsers();
  }catch(e){
    if(!usersCache.length){
      list.innerHTML = '<div class="empty-block"><span class="icon">⚠️</span><h3>خطا در بارگذاری</h3></div>';
    }
  }
}

function renderUserList(items){
  const list = document.getElementById('usersList');
  if(!items.length){
    list.innerHTML = '<div class="empty-block"><span class="icon">🔍</span><h3>موردی پیدا نشد</h3></div>';

document.getElementById('usersList').addEventListener('click', e => {

/* ═══════════ User detail ═══════════ */
async function loadUser(userId, silent, force){
  const seq = ++reqSeq;
  const changed = userId !== currentUserId;
  currentUserId = userId;
  document.querySelectorAll('.user-item').forEach(el =>
    el.classList.toggle('active', parseInt(el.dataset.uid, 10) === userId));

  const main = document.getElementById('mainArea');
  if(!silent || changed){
    main.innerHTML = '<div class="main-inner"><div class="spinner"></div></div>';
    lastSig = '';
  }

  try{
    const d = await getJSON(`/api/behavior-analysis/${userId}/`);
    if(seq !== reqSeq) return;
    if(!d.success){
      main.innerHTML = `<div class="main-inner"><div class="error-box">${escapeHtml(d.msg||'خطا')}</div></div>`;
      return;
    }
    const sig = JSON.stringify(d);
    if(!force && sig === lastSig) return;
    if(silent && !force && currentTab === 'chat') return;
    lastSig = sig;
    renderUser(d);
  }catch(e){
    if(seq !== reqSeq) return;
    if(!silent){
      main.innerHTML = '<div class="main-inner"><div class="error-box">خطا در ارتباط با سرور</div></div>';
    }
  }
}

function setTab(name){
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p =>
    p.classList.toggle('active', p.id === 'panel-' + name));
  if(name === 'overview') Object.values(charts).forEach(c => c && c.resize());
  if(name === 'files'){
    requestAnimationFrame(() =>
      document.querySelectorAll('.score-bar i').forEach(i => i.style.width = i.dataset.w + '%'));
  }
}

function applyFilter(f){
  currentFilter = f;
  document.querySelectorAll('.filter-row .chip').forEach(c =>
    c.classList.toggle('active', c.dataset.f === f));
  document.querySelectorAll('#fileTableBody tr').forEach(row => {
    const rel = row.dataset.rel === '1';
    const susp = row.dataset.susp === '1';
    row.style.display =
      (f==='all' || (f==='related'&&rel) || (f==='unrelated'&&!rel) || (f==='suspicious'&&susp))
      ? '' : 'none';
  });
}

/* ═══════════ Custom Stats UI ═══════════ */
function renderCustomStats(userId){
  const list = loadCustomStats(userId);
  const container = document.getElementById('customStatsGrid');
  if(!container) return;
  const b = (lastData && lastData.behavior) || {};
  container.innerHTML = list.map((s, i) => {
    const { value, suffix } = evaluateCustomStat(s, b);
    return `
      <div class="custom-stat">
        <div class="cs-label">
          <span>${escapeHtml(s.label)}</span>
          <button class="rm" title="حذف" onclick="removeCustomStat(${i})">×</button>
        </div>
        <div class="cs-value">${value}${suffix ? `<span style="font-size:13px;color:var(--text-3);margin-inline-start:2px">${suffix}</span>` : ''}</div>
        <div class="cs-formula">${escapeHtml(STAT_FORMULAS[s.formula]?.label || s.formula)}</div>
      </div>`;
  }).join('');
}

function removeCustomStat(index){
  if(!currentUserId) return;
  const list = loadCustomStats(currentUserId);
  list.splice(index, 1);
  saveCustomStats(currentUserId, list);
  renderCustomStats(currentUserId);
}
window.removeCustomStat = removeCustomStat;

function toggleCustomStatForm(){
  const form = document.getElementById('customStatForm');
  if(!form) return;
  form.style.display = form.style.display === 'none' ? 'grid' : 'none';
  if(form.style.display === 'grid'){
    const labelInput = document.getElementById('csLabel');
    if(labelInput) labelInput.focus();
  }
}
window.toggleCustomStatForm = toggleCustomStatForm;

function submitCustomStat(e){
  e.preventDefault();
  if(!currentUserId) return;
  const label = (document.getElementById('csLabel')?.value || '').trim();
  const formula = document.getElementById('csFormula')?.value || 'total';
  if(!label){ return; }
  const list = loadCustomStats(currentUserId);
  list.push({ label, formula });
  saveCustomStats(currentUserId, list);
  document.getElementById('csLabel').value = '';
  toggleCustomStatForm();
  renderCustomStats(currentUserId);
}
window.submitCustomStat = submitCustomStat;

              <span class="icon">💬</span>
              <h3 style="color:var(--text);font-size:14px">چت با هوش مصنوعی</h3>
              <p>برای شروع، روی «جلسه جدید» بزنید تا روی فایل‌های این کاربر گفتگو کنید</p>
            </div>
          </div>
          <div id="chatImageResult" class="chat-image-result" style="display:none"></div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="سوال خود را بنویسید..." disabled>
            <button class="btn btn-primary" id="chatSend" disabled>ارسال</button>
          </div>
        </div>
      </div>

      <!-- PSYCHOLOGY -->
      <div class="tab-panel" id="panel-psychology">
        <div class="psy-header">
          <h3>🧠 تحلیل روانشناسی رفتار</h3>
          <div class="psy-actions">
            <button class="btn" onclick="psyRunFresh(window.currentUserId || 0)">🔄 تحلیل مجدد</button>
            <button class="btn" onclick="analyzeAllFiles(window.currentUserId||0)">📁 تحلیل فایل‌ها</button>
          </div>
        </div>
        <div id="psyBox"></div>
      </div>

    </div>
  `;

  document.querySelectorAll('.stat-cell .sv').forEach(countUp);

  document.querySelectorAll('#tabsBar .tab').forEach(btn =>
    btn.addEventListener('click', () => setTab(btn.dataset.tab)));
  document.querySelectorAll('#filterChips .chip').forEach(chip =>
    chip.addEventListener('click', () => applyFilter(chip.dataset.f)));

  applyFilter(currentFilter);
  setTab(currentTab);
  buildCharts(d);

  /* رندر کارت‌های سفارشی */
  renderCustomStats(user.id);

  /* اگر قبلاً موضوعی انتخاب شده بود، دوباره نمایش بده */
  if(activeTopicName) showTopicDetail(activeTopicName);

  const chatFiles = files.map(f => f.file_id).filter(Boolean);
  chatBind(chatFiles, d.user.id);

  psyLoadForUser(user.id);
}

/* ═══════════ Live refresh ═══════════ */
setInterval(() => {
  if(document.hidden) return;
  loadUsers();
  if(currentUserId) loadUser(currentUserId, true);
}, 30000);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && currentUserId) loadUser(currentUserId, true);
});

/* ═══════════ Chat ═══════════ */
const chatState = { sessionId: null, sending: false, filesForChat: [], targetUserId: null };
const chatEl = id => document.getElementById(id);

function chatSetEnabled(enabled){
  const input = chatEl('chatInput'), send = chatEl('chatSend');
  if(input) input.disabled = !enabled;
  if(send) send.disabled = !enabled || chatState.sending;
  const imageBtn = chatEl('chatGenerateImage');
  if(imageBtn) imageBtn.disabled = !enabled || chatState.sending;
}

function chatAppend(role, content){
  const wrap = chatEl('chatMessages');
  if(!wrap) return null;
  const empty = wrap.querySelector('.chat-empty');
  if(empty) empty.remove();
  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  div.innerHTML = `
    <div class="chat-avatar">${role === 'user' ? '👤' : '🤖'}</div>
    <div class="chat-bubble">${escapeHtml(content)}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div;
}

function chatShowTyping(){
  const wrap = chatEl('chatMessages');
  if(!wrap) return null;
  const div = document.createElement('div');
  div.className = 'chat-msg assistant';
  div.id = 'chatTyping';
  div.innerHTML = `
    <div class="chat-avatar">🤖</div>
    <div class="chat-bubble"><div class="chat-typing"><i></i><i></i><i></i></div></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div;
}

async function chatStartSession(){
  const btn = chatEl('chatNewSession'), status = chatEl('chatStatus');
  if(!btn) return;
  btn.disabled = true;
  if(status) status.textContent = 'در حال ساخت جلسه...';

  try{
    const r = await fetch('/api/report-chat/start/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
      body: JSON.stringify({
        file_ids: chatState.filesForChat,
        target_user_id: chatState.targetUserId,
        title: `چت روی ${chatState.filesForChat.length} فایل`,
      }),
    });
    const d = await r.json();
    if(!d.success){
      if(status) status.textContent = d.msg || 'خطا';
      return;
    }
    chatState.sessionId = d.session_id;
    if(status) status.textContent = `جلسه #${d.session_id} — ${d.file_count} فایل`;
    const wrap = chatEl('chatMessages');
    if(wrap) wrap.innerHTML = '';
    chatSetEnabled(true);
    chatEl('chatInput')?.focus();
  }catch(e){
    if(status) status.textContent = 'خطای شبکه';
  }finally{
    btn.disabled = false;
  }
}

async function chatSendMessage(){
  if(chatState.sending) return;
  const input = chatEl('chatInput'), status = chatEl('chatStatus');
  const q = (input?.value || '').trim();
  if(!q) return;

  if(!chatState.sessionId){
    await chatStartSession();
    if(!chatState.sessionId) return;
  }

  chatState.sending = true;
  if(input) input.value = '';
  chatAppend('user', q);
  chatSetEnabled(false);
  const typing = chatShowTyping();
  if(status) status.textContent = 'در حال پاسخ...';

  try{
    const r = await fetch(`/api/report-chat/${chatState.sessionId}/ask/`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
      body: JSON.stringify({question: q}),
    });
    const d = await r.json();
    if(typing) typing.remove();
    if(d.success){
      chatAppend('assistant', d.answer);
      if(status) status.textContent = 'آماده';
    }else{
      chatAppend('assistant', '⚠️ ' + (d.msg || 'خطا در دریافت پاسخ'));
      if(status) status.textContent = 'خطا';
    }
  }catch(e){
    if(typing) typing.remove();
    chatAppend('assistant', '⚠️ خطای شبکه');
    if(status) status.textContent = 'خطای شبکه';
  }finally{
    chatState.sending = false;
    chatSetEnabled(true);
    chatEl('chatInput')?.focus();
  }
}

async function chatGenerateImage(){
  const status = chatEl('chatStatus');
  const btn = chatEl('chatGenerateImage');
  const resultBox = chatEl('chatImageResult');

  if(!chatState.sessionId || !btn || btn.disabled) return;

  const topic = (chatEl('chatImageTopic')?.value || '').trim();
  if(!topic){
    if(status) status.textContent = 'ابتدا موضوع تصویر را وارد کنید';
    chatEl('chatImageTopic')?.focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ در حال تولید...';
  if(resultBox){
    resultBox.style.display = 'block';
    resultBox.textContent = 'در حال تولید تصویر...';
  }

  try{
    const response = await fetch(`/api/report-chat/${chatState.sessionId}/generate-image/`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken()},
      body: JSON.stringify({ topic })
    });
    const data = await response.json();
    if(!response.ok || !data.success){
      throw new Error(data.msg || 'تولید تصویر ناموفق بود');
    }
    let imageUrl = data.image_base64;
    if(!imageUrl.startsWith('data:')){
      const mime = ['image/png','image/jpeg','image/webp'].includes(data.mime_type)
        ? data.mime_type : 'image/png';
      imageUrl = `data:${mime};base64,${imageUrl}`;
    }
    const img = document.createElement('img');
    img.src = imageUrl;
    img.alt = topic;
    img.loading = 'lazy';
    resultBox.replaceChildren(img);
    if(data.image_prompt){
      const caption = document.createElement('p');
      caption.className = 'caption';
      caption.textContent = `پرامپت: ${data.image_prompt}`;
      resultBox.appendChild(caption);
    }
    if(status) status.textContent = 'تصویر با موفقیت تولید شد';
  }catch(error){
    if(resultBox) resultBox.textContent = error.message;
    if(status) status.textContent = 'خطا در تولید تصویر';
  }finally{
    btn.textContent = '🎨 تولید تصویر';
    btn.disabled = !chatState.sessionId;
  }
}

function chatBind(files, targetUserId){
  chatState.sessionId = null;
  chatState.filesForChat = files || [];
  chatState.targetUserId = targetUserId;
  chatSetEnabled(false);

  const newBtn = chatEl('chatNewSession');
  if(!newBtn) return;
  newBtn.onclick = chatStartSession;
  chatEl('chatSend').onclick = chatSendMessage;
  chatEl('chatGenerateImage').onclick = chatGenerateImage;
  chatEl('chatInput').onkeydown = (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); chatSendMessage(); }
  };
  const wrap = chatEl('chatMessages');
  if(wrap){
    wrap.innerHTML = `
      <div class="chat-empty">
        <span class="icon">💬</span>
        <h3 style="color:var(--text);font-size:14px">چت با هوش مصنوعی</h3>
        <p>برای شروع، روی «جلسه جدید» بزنید تا روی فایل‌های این کاربر گفتگو کنید</p>
      </div>`;
  }
  const status = chatEl('chatStatus');
  if(status) status.textContent = `آماده (${chatState.filesForChat.length} فایل)`;
}

/* ═══════════ Psychology ═══════════ */
async function psyLoadForUser(userId){
  const box = document.getElementById('psyBox');
  if(!box) return;
  box.innerHTML = '<div class="spinner"></div>';
  try{
    const r = await fetch(`/api/user/${userId}/psychology/`, {credentials:'same-origin'});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'خطا');
    if(!j.data){
      box.innerHTML = `
        <div class="empty-block">
          <span class="icon">🧠</span>
          <h3>هنوز تحلیلی ذخیره نشده</h3>
          <p>دکمه «تحلیل مجدد» را بزنید تا تحلیل انجام شود</p>
        </div>`;
      return;
    }
    const d = j.data;
    const color = d.risk_score >= 0.7 ? 'var(--red)'
                : (d.risk_score >= 0.35 ? 'var(--orange)' : 'var(--green)');
    box.innerHTML = `
      <div class="psy-scores">
        <div class="psy-score">
          <div class="label">ریسک</div>
          <div class="value" style="color:${color}">${(d.risk_score||0).toFixed(2)}</div>
        </div>
        <div class="psy-score">
          <div class="label">ناهنجاری</div>
          <div class="value">${(d.anomaly_score||0).toFixed(2)}</div>
        </div>
        <div class="psy-score">
          <div class="label">فشار کاری</div>
          <div class="value">${(d.stress_index||0).toFixed(2)}</div>
        </div>
        <div class="psy-score">
          <div class="label">نقش‌پذیری</div>
          <div class="value">${(d.role_fit_score||0).toFixed(2)}</div>
        </div>
      </div>
      <div class="psy-narrative">${escapeHtml(d.narrative||'—')}</div>
      ${(d.signals && d.signals.length) ? `
        <div class="psy-signals">
          ${d.signals.map(s => `<span class="psy-signal">${escapeHtml(s.code)}</span>`).join('')}
        </div>` : ''}
    `;
  }catch(e){
    box.innerHTML = `<div class="error-box">خطا: ${escapeHtml(e.message)}</div>`;
  }
}

async function psyRunFresh(userId){
  const box = document.getElementById('psyBox');
  if(box) box.innerHTML = `
    <div class="empty-block">
      <span class="icon">⏳</span>
      <h3>در حال تحلیل با هوش مصنوعی</h3>
      <p>ممکن است ۱ تا ۳ دقیقه طول بکشد...</p>
    </div>`;
  try{
    const r = await fetch(`/api/user/${userId}/psychology/`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'X-CSRFToken': getCsrfToken()},
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'خطا');
    psyLoadForUser(userId);
  }catch(e){
    if(box) box.innerHTML = `<div class="error-box">خطا: ${escapeHtml(e.message)}</div>`;
  }
}
window.psyRunFresh = psyRunFresh;

/* ═══════════ Analyze All Files ═══════════ */
async function analyzeAllFiles(userId){
  if(!userId) return;
  if(!confirm('تحلیل همه فایل‌های این کاربر در پس‌زمینه شروع شود؟')) return;
  try{
    const r = await fetch(`/api/user/${userId}/analyze-files/`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCsrfToken()
      },
      body: JSON.stringify({force: false})
    });
    const d = await r.json();
    if(d.success){
      alert(`✅ تحلیل ${d.file_count} فایل شروع شد (task: ${d.task_id.slice(0,8)})`);
    }else{
      alert('❌ ' + (d.msg || 'خطا'));
    }
  }catch(e){
    alert('❌ خطای شبکه');
  }
}
window.analyzeAllFiles = analyzeAllFiles;

loadUsers();
