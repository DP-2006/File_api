<script>
function getSummary(level) {
    const resultDiv = document.getElementById('resultArea');
    resultDiv.innerHTML = 'در حال تحلیل توسط AI... ⏳';
    
    fetch(window.location.href, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: `level=${level}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            let html = '';
            if (data.result.summary) {
                html = `<h4>📄 خلاصه فایل</h4><p>${data.result.summary.replace(/\n/g, '<br>')}</p>`;
            } else {
                html = `<p>${data.result}</p>`;
            }
            resultDiv.innerHTML = html;
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger">خطا: ${data.error}</div>`;
        }
    });
}

function askQuestion() {
    const question = document.getElementById('questionInput').value;
    if (!question) {
        alert('لطفاً سوال خود را وارد کنید');
        return;
    }
    
    const resultDiv = document.getElementById('resultArea');
    resultDiv.innerHTML = `در حال پاسخ به "${question}"... ⏳`;
    
    fetch(window.location.href, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: `question=${encodeURIComponent(question)}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            resultDiv.innerHTML = `<h4>💬 پاسخ AI:</h4><p>${data.result.replace(/\n/g, '<br>')}</p>`;
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger">خطا: ${data.error}</div>`;
        }
    });
}

function getCookie(name) {
    let value = "; " + document.cookie;
    let parts = value.split("; " + name + "=");
    if (parts.length === 2) return parts.pop().split(";").shift();
}
</script>
