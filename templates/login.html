<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0f2027;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --gold-accent: #d4af37;
            --turquoise-accent: #00d2ff;
            --text-color: #ecf0f1;
            --input-bg: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-image: url('https://sfile.chatglm.cn/images-ppt/c97d61e342cb.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 32, 39, 0.7);
            z-index: 0;
        }

        .login-box {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px;
            border-radius: 20px 20px 120px 120px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.1);
            width: 380px;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease;
        }
        
        .login-box::after {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px 14px 114px 114px;
            pointer-events: none;
        }

        .login-header {
            margin-bottom: 40px;
            position: relative;
        }

        h2 {
            color: var(--text-color);
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 28px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .ornament {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, transparent 30%, var(--gold-accent) 31%, var(--gold-accent) 35%, transparent 36%),
                        conic-gradient(from 0deg, transparent 0deg, var(--gold-accent) 10deg, transparent 20deg);
            background-size: 100% 100%;
            margin: 0 auto 20px;
            opacity: 0.9;
            border-radius: 50%;
            animation: rotate 20s linear infinite;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: right;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 40px;
            margin: 0;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            color: var(--text-color);
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(236, 240, 241, 0.6);
        }

        input:focus {
            background: rgba(0, 0, 0, 0.5);
            border-bottom-color: var(--turquoise-accent);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }
        
        .input-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-accent);
            font-size: 20px;
            pointer-events: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 30px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
            background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%);
        }
        
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        button::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }
        
        button:hover:not(:disabled)::after {
            left: 100%;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        button.loading .btn-text { display: none; }
        button.loading .spinner { display: block; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 10000;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(10px);
            max-width: 400px;
        }
        .toast-success { background: rgba(16,185,129,0.9); border-right: 4px solid #10b981; }
        .toast-error { background: rgba(239,68,68,0.9); border-right: 4px solid #ef4444; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
