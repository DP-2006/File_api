<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- فونت اختیاری است؛ اگر لود نشد فونت سیستم جایگزین می‌شود -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* ⬇ آدرس عکس را با عکس خودتان در static عوض کنید */
            background-image:
                url('https://z-cdn-media.chatglm.cn/files/ed8a8eeb-4c0b-446b-8cd8-9b94e7c85c10.jpg'),
                linear-gradient(160deg, #27ff39 0%, #ffee03 55%, #221616 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            padding: 45px 40px 40px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(5px);
            text-align: center;
        }

        .login-box h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .login-box .subtitle {
            font-size: 14px;
            color: #8a8f98;
            margin-bottom: 32px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: #b3b8c0;
            pointer-events: none;
            transition: fill .25s;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            border: 1.5px solid #e2e5ea;
            border-radius: 8px;
            background: #f7f8fa;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color .25s, box-shadow .25s;
        }

        .input-group input:focus {
            border-color: #ff7a00;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.14);
        }

        .input-group input:focus + .icon { fill: #ff7a00; }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 26px;
            font-size: 13px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #6b7280;
            cursor: pointer;
            user-select: none;
        }

        .options input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #ff7a00;
            cursor: pointer;
        }

        .options a {
            color: #ff7a00;
            text-decoration: none;
            font-weight: 500;
        }

        .options a:hover { text-decoration: underline; }

        #submitBtn {
            position: relative;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff8c1a, #ff6a00);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 106, 0, 0.35);
            transition: transform .15s, box-shadow .25s, opacity .25s;
        }

        #submitBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(255, 106, 0, 0.45);
        }

        #submitBtn:disabled { cursor: not-allowed; }

        /* حالت loading که اسکریپت JS اضافه می‌کند */
        #submitBtn.loading { opacity: .75; pointer-events: none; }

        #submitBtn.loading::after {
            content: "";
            position: absolute;
            left: 16px;
            top: 50%;
            width: 15px;
            height: 15px;
            margin-top: -7.5px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .social {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .social a {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 8px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: opacity .2s, transform .15s;
        }

        .social a:hover { opacity: .88; transform: translateY(-1px); }

        .social .facebook { background: #3b5998; }
        .social .twitter  { background: #1da1f2; }

        .social svg { width: 15px; height: 15px; fill: #fff; flex-shrink: 0; }

        /* ---------- Toast (پیام‌های اسکریپت JS) ---------- */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 90%;
            padding: 13px 28px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: Tahoma, 'Segoe UI', sans-serif;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            animation: toastIn .35s ease;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-18px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .toast-success { background: #16a34a; }
        .toast-error   { background: #dc2626; }
        .toast-info    { background: #2563eb; }

        @media (max-width: 480px) {
            .login-box { padding: 35px 24px 30px; }
            .login-box h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Login #10</h1>
        <p class="subtitle">Have an account?</p>

        <form id="loginForm" method="post" action="/login/">
            {% csrf_token %}

            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-3.33 0-10 1.67-10 5v2a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2c0-3.33-6.67-5-10-5z"/>
                </svg>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9zm3 12a2 2 0 1 1 2-2 2 2 0 0 1-2 2z"/>
                </svg>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="remember" name="remember"> Remember Me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" id="submitBtn">LOGIN</button>

            <div class="social">
                <a href="#" class="facebook">
                    <svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.94H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89a15.4 15.4 0 0 1 2.24.2v2.46h-1.26a1.44 1.44 0 0 0-1.63 1.56V12h2.77l-.44 2.94h-2.33v6.94A10 10 0 0 0 22 12z"/></svg>
                    Facebook
                </a>
                <a href="#" class="twitter">
                    <svg viewBox="0 0 24 24"><path d="M23 4.94a8.45 8.45 0 0 1-2.42.66 4.23 4.23 0 0 0 1.85-2.33 8.44 8.44 0 0 1-2.67 1.02 4.21 4.21 0 0 0-7.27 3.84A11.94 11.94 0 0 1 2.8 3.98a4.2 4.2 0 0 0 1.3 5.62 4.18 4.18 0 0 1-1.9-.53v.05a4.21 4.21 0 0 0 3.37 4.12 4.2 4.2 0 0 1-1.9.07 4.21 4.21 0 0 0 3.93 2.92A8.44 8.44 0 0 1 2 18.44a11.94 11.94 0 0 0 18.2-10.6A8.4 8.4 0 0 0 23 4.94z"/></svg>
                    Twitter
                </a>
            </div>
        </form>
    </div>

    <script>
        /* اسکریپت شما — بدون هیچ تغییری */
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            const formData = new FormData();
            formData.append('username', u);
            formData.append('password', p);

            try {
                const res = await fetch('/login/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken'),
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: formData
                });

                const data = await res.json();

                if (data.success) {
                    if (data.token) {
                        localStorage.setItem('authToken', data.token);
                        sessionStorage.setItem('authToken', data.token);
                        console.log('توکن با موفقیت ذخیره شد:', data.token.substring(0, 20) + '...');
                    }

                    showToast('ورود موفق! در حال انتقال به داشبورد...', 'success');

                    setTimeout(() => {
                        window.location.href = '/dashboard/';
                    }, 500);
                } else {
                    showToast(data.msg || 'نام کاربری یا رمز عبور اشتباه است', 'error');
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('خطا در ارتباط با سرور', 'error');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });

        window.onload = function() {
            const token = localStorage.getItem('authToken');
            if (token) {
                fetch('/dashboard/', {
                    headers: {
                        'Authorization': `Token ${token}`
                    }
                }).then(res => {
                    if (res.ok) {
                        window.location.href = '/dashboard/';
                    } else {
                        localStorage.removeItem('authToken');
                        sessionStorage.removeItem('authToken');
                    }
                }).catch(() => {});
            }
        };
    </script>
</body>
</html>
