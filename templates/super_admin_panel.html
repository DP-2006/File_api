<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<title>User Manage · iOS 27 Liquid Glass</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Fonts: Vazirmatn + Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   iOS 27 · Liquid Glass Design System
   ========================================================= */
:root{
  --glass-bg: rgba(255,255,255,.55);
  --glass-bg-strong: rgba(255,255,255,.78);
  --glass-border: rgba(255,255,255,.65);
  --glass-stroke: rgba(15,23,42,.08);
  --glass-shadow: 0 8px 32px rgba(15,23,42,.08), 0 1px 0 rgba(255,255,255,.7) inset;
  --blur: 30px; --blur-strong: 50px;
  --text-primary:#0f172a; --text-secondary:#475569; --text-tertiary:#94a3b8;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --purple:#bf5af2; --indigo:#5e5ce6;
  --r-xs:10px; --r-sm:14px; --r-md:20px; --r-lg:28px; --r-xl:36px; --r-full:999px;
  --bg-base:#eef1f6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Vazirmatn','Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Tahoma,sans-serif;
  color:var(--text-primary);
  background:var(--bg-base);
  background-image:
    radial-gradient(1200px 800px at 90% -10%, rgba(10,132,255,.18), transparent 60%),
    radial-gradient(1000px 700px at -10% 20%, rgba(191,90,242,.14), transparent 55%),
    radial-gradient(900px 600px at 50% 110%, rgba(48,209,88,.12), transparent 60%);
  background-attachment:fixed;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============ Layout ============ */
.app-shell{display:flex;height:100vh;padding:14px;gap:14px}

/* ============ Glass ============ */
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  border-radius:var(--r-lg);
}

/* ============ Sidebar ============ */
.sidebar{width:300px;display:flex;flex-direction:column;padding:22px 18px;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--glass-stroke)}
.brand-icon{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(135deg,#0a84ff,#5e5ce6);
  display:grid;place-items:center;color:#fff;font-size:1.15rem;
  box-shadow:0 6px 18px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.5);
}
.brand-title{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.brand-subtitle{font-size:.7rem;color:var(--text-tertiary);font-weight:500}

.control-card{
  background:rgba(255,255,255,.5);
  border:1px solid var(--glass-border);
  border-radius:var(--r-md);padding:14px;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 2px 12px rgba(15,23,42,.04);
}
.control-label{font-size:.75rem;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.control-label i{color:var(--blue)}

/* ============ Inputs ============ */
.input-glass{
  width:100%;padding:11px 14px;border-radius:var(--r-sm);
  border:1px solid rgba(15,23,42,.08);
  background:rgba(255,255,255,.7);
  font-family:inherit;font-size:.85rem;color:var(--text-primary);
  transition:all .25s cubic-bezier(.4,0,.2,1);
}
.input-glass::placeholder{color:var(--text-tertiary)}
.input-glass:focus{
  outline:none;background:rgba(255,255,255,.95);
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(10,132,255,.15);
}

/* ============ Buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border:none;border-radius:var(--r-full);
  font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  letter-spacing:-.01em;user-select:none;
}
.btn:active{transform:scale(.96)}
.btn-primary{
  background:linear-gradient(180deg,#1a8dff,#0a84ff);color:#fff;
  box-shadow:0 4px 14px rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.35);
}
.btn-primary:hover{background:linear-gradient(180deg,#0a84ff,#0070e0)}
.btn-success{
  background:linear-gradient(180deg,#34d95f,#30d158);color:#fff;
  box-shadow:0 4px 14px rgba(48,209,88,.35), inset 0 1px 0 rgba(255,255,255,.35);
}
.btn-success:hover{filter:brightness(.95)}
.btn-ghost{
  background:rgba(255,255,255,.55);color:var(--text-primary);
  border:1px solid var(--glass-stroke);backdrop-filter:blur(20px);
}
.btn-ghost:hover{background:rgba(255,255,255,.85)}

/* ============ Main ============ */
.main-area{flex:1;display:flex;flex-direction:column;padding:20px 22px;gap:16px;overflow:hidden;min-width:0}
.top-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.page-title{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
.page-title i{color:var(--blue)}

.search-box{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-radius:var(--r-full);
  background:rgba(255,255,255,.6);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);
  transition:all .25s ease;min-width:260px;
}
.search-box:focus-within{background:rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(10,132,255,.12)}
.search-box i{color:var(--text-tertiary);font-size:.85rem}
.search-box input{
  flex:1;border:none;background:transparent;outline:none;
  font-family:inherit;font-size:.85rem;color:var(--text-primary);
}

/* ============ Users Scroll ============ */
.user-scroll{flex:1;overflow-y:auto;padding:4px 2px;margin:-4px -2px}
.user-scroll::-webkit-scrollbar{width:8px}
.user-scroll::-webkit-scrollbar-thumb{background:rgba(15,23,42,.15);border-radius:20px}
.user-scroll::-webkit-scrollbar-track{background:transparent}

/* ============ User Card ============ */
.user-card{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 18px;margin-bottom:10px;border-radius:var(--r-md);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:0 2px 12px rgba(15,23,42,.04), inset 0 1px 0 rgba(255,255,255,.8);
  transition:all .25s cubic-bezier(.4,0,.2,1);
  animation:cardIn .4s cubic-bezier(.22,1,.36,1) backwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.user-card:hover{
  background:rgba(255,255,255,.75);
  transform:translateY(-1px);
  box-shadow:0 10px 28px rgba(15,23,42,.08), inset 0 1px 0 rgba(255,255,255,.9);
}

.user-info{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.avatar{
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(145deg,#e0e7ff,#c7d2fe);
  display:grid;place-items:center;color:var(--indigo);font-size:1.1rem;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 3px 10px rgba(94,92,230,.15);
}
.user-name{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.badge-self{
  font-size:.65rem;padding:3px 9px;border-radius:var(--r-full);
  background:linear-gradient(180deg,#dbeafe,#bfdbfe);color:#1e40af;font-weight:600;
}
.user-username{font-size:.73rem;color:var(--text-tertiary);margin-top:2px}
.user-status{font-size:.7rem;margin-top:3px;font-weight:500}
.status-active{color:var(--green)}
.status-blocked{color:var(--red)}

/* ============ Action Buttons ============ */
.action-group{display:flex;gap:6px;flex-wrap:wrap}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--glass-stroke);
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(10px);
  cursor:pointer;display:grid;place-items:center;
  font-size:.82rem;transition:all .2s cubic-bezier(.4,0,.2,1);
  color:var(--text-secondary);
}
.icon-btn:hover{transform:translateY(-2px) scale(1.05);background:rgba(255,255,255,.95)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.ai{color:var(--purple)} .icon-btn.ai:hover{box-shadow:0 6px 16px rgba(191,90,242,.3)}
.icon-btn.block{color:var(--orange)} .icon-btn.block:hover{box-shadow:0 6px 16px rgba(255,159,10,.3)}
.icon-btn.edit{color:var(--blue)} .icon-btn.edit:hover{box-shadow:0 6px 16px rgba(10,132,255,.3)}
.icon-btn.delete{color:var(--red)} .icon-btn.delete:hover{box-shadow:0 6px 16px rgba(255,69,58,.3)}

/* ============ Pagination ============ */
.pagination{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding-top:4px}
.page-btn{
  min-width:36px;height:36px;padding:0 12px;border-radius:var(--r-full);
  border:1px solid var(--glass-stroke);background:rgba(255,255,255,.6);
  backdrop-filter:blur(20px);font-family:inherit;font-size:.78rem;font-weight:600;
  cursor:pointer;transition:all .2s;color:var(--text-primary);
}
.page-btn:hover{background:rgba(255,255,255,.9)}
.page-btn.active{
  background:linear-gradient(180deg,#1a8dff,#0a84ff);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(10,132,255,.4);
}

/* ============ Perm Panel ============ */
.perm-panel{width:340px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.perm-header{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:700;padding-bottom:12px;border-bottom:1px solid var(--glass-stroke)}
.perm-header i{color:var(--indigo)}
.perm-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:2px}
.perm-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:var(--r-sm);background:rgba(255,255,255,.5);
  border:1px solid transparent;font-size:.76rem;cursor:pointer;
  transition:all .2s;user-select:none;
}
.perm-item:hover{background:rgba(255,255,255,.8)}
.perm-item.selected{
  background:linear-gradient(180deg,#e0e7ff,#dbeafe);
  border-color:var(--blue);box-shadow:0 2px 10px rgba(10,132,255,.15);
}
.perm-item input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;
  width:18px;height:18px;border-radius:50%;
  border:1.5px solid rgba(15,23,42,.2);background:#fff;
  cursor:pointer;position:relative;flex-shrink:0;transition:all .2s;
}
.perm-item input[type="checkbox"]:checked{
  background:linear-gradient(180deg,#1a8dff,#0a84ff);border-color:var(--blue);
  box-shadow:0 2px 8px rgba(10,132,255,.4);
}
.perm-item input[type="checkbox"]:checked::after{
  content:'';position:absolute;left:5px;top:1.5px;width:5px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.perm-item span{flex:1;word-break:break-word;color:var(--text-secondary);font-weight:500}
.perm-item.selected span{color:var(--text-primary)}

/* ============ Modal ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;z-index:9999;
  padding:20px;animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{
  width:100%;max-width:920px;max-height:88vh;overflow-y:auto;padding:24px;
  border-radius:var(--r-xl);
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(50px) saturate(200%);
  -webkit-backdrop-filter:blur(50px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 30px 80px rgba(15,23,42,.25), inset 0 1px 0 rgba(255,255,255,.9);
  animation:modalIn .4s cubic-bezier(.22,1,.36,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--glass-stroke);margin-bottom:18px}
.modal-title{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.modal-close{
  width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(15,23,42,.06);color:var(--text-secondary);
  font-size:1.3rem;cursor:pointer;display:grid;place-items:center;
  transition:all .2s;line-height:1;
}
.modal-close:hover{background:rgba(255,69,58,.15);color:var(--red)}
.section-title{font-size:.85rem;font-weight:700;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--glass-stroke);color:var(--text-primary)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field label{display:block;font-size:.75rem;color:var(--text-secondary);margin-bottom:5px;font-weight:500}
.checkbox-row{display:flex;gap:18px;flex-wrap:wrap;padding:10px 0}
.checkbox-row label{display:flex;align-items:center;gap:8px;font-size:.82rem;cursor:pointer;font-weight:500}
.checkbox-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--blue);cursor:pointer}

.perm-box{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;
  padding:12px;background:rgba(248,250,252,.6);border-radius:var(--r-md);
  max-height:180px;overflow-y:auto;border:1px solid var(--glass-stroke);
}
.perm-box label{display:flex;align-items:center;gap:8px;font-size:.74rem;cursor:pointer;padding:4px 6px;border-radius:8px;transition:background .15s}
.perm-box label:hover{background:rgba(255,255,255,.8)}
.perm-box input[type="checkbox"]{width:15px;height:15px;accent-color:var(--blue);flex-shrink:0}

.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--glass-stroke)}

/* ============ AI Result ============ */
.ai-result{
  padding:18px;border-radius:var(--r-md);background:rgba(248,250,252,.7);
  border:1px solid var(--glass-stroke);line-height:1.85;font-size:.85rem;
  white-space:pre-wrap;word-break:break-word;max-height:55vh;overflow-y:auto;
}
.stats-box{
  background:linear-gradient(135deg,#e0e7ff,#ede9fe);
  padding:14px 16px;border-radius:var(--r-md);margin-bottom:16px;
  font-size:.82rem;line-height:1.8;border:1px solid rgba(94,92,230,.2);
}
.stats-box strong{color:var(--indigo)}

/* ============ Spinner ============ */
.spinner{
  display:inline-block;width:22px;height:22px;
  border:3px solid rgba(10,132,255,.2);border-top-color:var(--blue);
  border-radius:50%;animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:40px 20px;color:var(--text-secondary);font-size:.85rem;text-align:center;
}

/* ============ Toast ============ */
.toast-container{position:fixed;bottom:24px;left:24px;display:flex;flex-direction:column;gap:10px;z-index:99999}
.toast{
  padding:12px 22px;border-radius:var(--r-full);color:#fff;
  font-size:.82rem;font-weight:600;
  box-shadow:0 12px 40px rgba(15,23,42,.25);
  backdrop-filter:blur(20px);
  animation:toastIn .35s cubic-bezier(.22,1,.36,1);
  display:flex;align-items:center;gap:10px;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-30px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
.toast.success{background:linear-gradient(180deg,rgba(48,209,88,.95),rgba(36,180,70,.95))}
.toast.error{background:linear-gradient(180deg,rgba(255,91,82,.95),rgba(255,69,58,.95))}

/* ============ Empty ============ */
.empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;color:var(--text-tertiary);font-size:.85rem}
.empty-state i{font-size:2.5rem;opacity:.4}

/* ============ Responsive ============ */
@media (max-width:1100px){.perm-panel{width:300px}}
@media (max-width:860px){
  body{overflow:auto}
  .app-shell{flex-direction:column;height:auto;padding:10px;gap:10px}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;padding:16px;gap:12px}
  .sidebar .brand{width:100%}
  .control-card{flex:1;min-width:200px}
  .perm-panel{width:100%;max-height:60vh}
  .main-area{padding:16px;min-height:70vh}
  .form-grid{grid-template-columns:1fr}
  .page-title{font-size:1.2rem}
  .search-box{min-width:100%}
}
</style>
</head>
<body>

<!-- ===================== APP SHELL ===================== -->
<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar glass">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-crown"></i></div>
      <div>
        <div class="brand-title">User Manage</div>
        <div class="brand-subtitle">iOS 27 · Liquid Glass</div>
      </div>
    </div>

    <div class="control-card">
      <div class="control-label"><i class="fas fa-key"></i><span>سیاست رمز عبور</span></div>
      <input type="number" id="minLengthInput" class="input-glass" placeholder="حداقل طول رمز" value="8">
      <button class="btn btn-primary" id="savePolicyBtn">
        <i class="fas fa-floppy-disk"></i> ذخیره سیاست
      </button>
    </div>

    <div class="control-card">
      <div class="control-label"><i class="fas fa-layer-group"></i><span>ایجاد نقش جدید</span></div>
      <input type="text" id="newRoleName" class="input-glass" placeholder="نام نقش">
      <button class="btn btn-success" id="createRoleBtn">
        <i class="fas fa-plus"></i> ایجاد نقش
      </button>
    </div>

    <button class="btn btn-ghost" id="backHomeBtn" style="margin-top:auto">
      <i class="fas fa-arrow-right"></i> بازگشت
    </button>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main-area glass">
    <div class="top-nav">
      <div class="page-title"><i class="fas fa-users"></i> کاربران سامانه</div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchUsersInput" placeholder="جستجو (نام یا یوزرنیم)">
      </div>
    </div>

    <div class="user-scroll" id="userScroll">
      <div id="usersDynamicList"></div>
    </div>

    <div class="pagination" id="paginationControls"></div>
  </main>

  <!-- ============ PERM PANEL ============ -->
  <aside class="perm-panel glass">
    <div class="perm-header">
      <i class="fas fa-shield-alt"></i>
      <span>دسترسی‌ها بر اساس نقش</span>
    </div>
    <select id="roleSelect" class="input-glass">
      <option value="">— انتخاب نقش —</option>
    </select>
    <div class="perm-list" id="permissionsList">
      <div style="font-size:.75rem;color:#6c757d">در حال بارگذاری...</div>
    </div>
    <button class="btn btn-primary" id="savePermsBtn">
      <i class="fas fa-floppy-disk"></i> ذخیره دسترسی‌ها
    </button>
  </aside>

</div>

<!-- ============ AI MODAL ROOT ============ -->
<div id="modalRoot"></div>

<!-- ============ TOASTS ============ -->
<div class="toast-container" id="toastContainer"></div>

<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->
<script>
/* ============ Config ============ */
let currentUserId = parseInt(window.__CURRENT_USER_ID__ || '0', 10);
if (!currentUserId && window.DJANGO_USER_ID) {
  currentUserId = parseInt(window.DJANGO_USER_ID, 10) || 0;
}

/* ============ State ============ */
let allUsersData = [];
let currentPage = 1;
const pageSize = 10;
let currentSearchTerm = "";
let allRoles = [];
let allPermissions = [];
let selectedRoleId = null;
let currentAnalysis = '';
let currentAITarget = null;

/* ============ Helpers ============ */
function getCookie(name){
  let v = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const c = cookies[i].trim();
      if (c.substring(0, name.length + 1) === name + '=') {
        v = decodeURIComponent(c.substring(name.length + 1));
        break;
      }
    }
  }
  return v;
}
const csrftoken = getCookie('csrftoken');

function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function showMsg(text, isError = false){
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + (isError ? 'error' : 'success');
  el.innerHTML = `<i class="fas ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${escapeHtml(text)}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* ============ API Calls ============ */
async function loadRoles(){
  try {
    const r = await fetch('/api/roles/');
    if (r.ok) { allRoles = await r.json(); console.log('Roles:', allRoles.length); }
    else console.error('roles failed', r.status);
  } catch(e){ console.error(e); }
}

async function loadPermissions(){
  try {
    const r = await fetch('/api/all-permissions/');
    if (r.ok) { allPermissions = await r.json(); console.log('Perms:', allPermissions.length); }
    else console.error('perms failed', r.status);
  } catch(e){ console.error(e); }
}

async function loadUsers(){
  try {
    const r = await fetch('/api/users-list/');
    if (r.ok) {
      allUsersData = await r.json();
      renderPaginatedUsers();
    } else {
      document.getElementById('usersDynamicList').innerHTML =
        '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i><div>خطا در بارگذاری کاربران</div></div>';
    }
  } catch(e){
    document.getElementById('usersDynamicList').innerHTML =
      '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i><div>خطا در بارگذاری کاربران</div></div>';
  }
}

/* ============ Initial bootstrap ============ */
async function fetchInitialData(){
  await loadRoles();
  await loadPermissions();
  populateRoleSelect();
  renderPermissionsUI();
}

/* ============ Role select ============ */
function populateRoleSelect(){
  const select = document.getElementById('roleSelect');
  if (!select) return;
  select.innerHTML = '<option value="">— انتخاب نقش —</option>';
  allRoles.forEach(role => {
    const opt = document.createElement('option');
    opt.value = role.id;
    opt.textContent = role.name;
    select.appendChild(opt);
  });
  select.onchange = (e) => {
    selectedRoleId = e.target.value ? parseInt(e.target.value) : null;
    if (selectedRoleId) fetchRolePermissions(selectedRoleId);
    else clearPermissionChecks();
  };
}

async function fetchRolePermissions(roleId){
  try {
    const r = await fetch(`/api/role-permissions/${roleId}/`);
    if (r.ok) {
      const ids = await r.json();
      document.querySelectorAll('#permissionsList .perm-check').forEach(cb => {
        const checked = ids.includes(parseInt(cb.value));
        cb.checked = checked;
        const parent = cb.closest('.perm-item');
        if (parent) parent.classList.toggle('selected', checked);
      });
    }
  } catch(e){ console.error(e); }
}

function clearPermissionChecks(){
  document.querySelectorAll('#permissionsList .perm-check').forEach(cb => {
    cb.checked = false;
    const parent = cb.closest('.perm-item');
    if (parent) parent.classList.remove('selected');
  });
}

function renderPermissionsUI(){
  const container = document.getElementById('permissionsList');
  if (!container) return;
  if (!allPermissions.length){
    container.innerHTML = '<div style="font-size:.7rem">هیچ دسترسی‌ای یافت نشد</div>';
    return;
  }
  container.innerHTML = '';
  const displayPerms = allPermissions.slice(0, 100);
  displayPerms.forEach(perm => {
    const div = document.createElement('div');
    div.className = 'perm-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = perm.id;
    cb.className = 'perm-check';
    cb.addEventListener('change', (e) => {
      e.stopPropagation();
      div.classList.toggle('selected', cb.checked);
    });
    const span = document.createElement('span');
    span.innerText = perm.name;
    div.appendChild(cb);
    div.appendChild(span);
    div.addEventListener('click', (e) => {
      if (e.target !== cb){
        cb.checked = !cb.checked;
        div.classList.toggle('selected', cb.checked);
      }
    });
    container.appendChild(div);
  });
}

/* ============ Save role permissions ============ */
document.getElementById('savePermsBtn').addEventListener('click', async () => {
  if (!selectedRoleId){ showMsg('نقشی انتخاب نشده', true); return; }
  const selectedPerms = [];
  document.querySelectorAll('#permissionsList .perm-check:checked').forEach(cb => {
    selectedPerms.push(parseInt(cb.value));
  });
  try {
    const resp = await fetch('/api/save-role-permissions/', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':csrftoken},
      body: JSON.stringify({role_id:selectedRoleId, permissions:selectedPerms})
    });
    const data = await resp.json();
    if (data.success) showMsg('دسترسی‌ها با موفقیت ذخیره شد');
    else showMsg('خطا: ' + data.msg, true);
  } catch(e){ showMsg('خطا شبکه', true); }
});

/* ============ Create role ============ */
document.getElementById('createRoleBtn').addEventListener('click', async () => {
  const roleName = document.getElementById('newRoleName').value.trim();
  if (!roleName){ showMsg('نام نقش را وارد کنید', true); return; }
  try {
    const resp = await fetch('/api/create-role/', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':csrftoken},
      body: JSON.stringify({name: roleName})
    });
    const data = await resp.json();
    if (data.success){
      showMsg('نقش با موفقیت ایجاد شد');
      document.getElementById('newRoleName').value = '';
      await loadRoles();
      populateRoleSelect();
    } else showMsg('خطا: ' + data.msg, true);
  } catch(e){ showMsg('خطا در ارتباط با سرور', true); }
});

/* ============ Users rendering ============ */
function renderPaginatedUsers(){
  let filtered = [...allUsersData];
  if (currentSearchTerm.trim() !== ''){
    const t = currentSearchTerm.trim().toLowerCase();
    filtered = filtered.filter(u =>
      (u.full_name || '').toLowerCase().includes(t) ||
      (u.username || '').toLowerCase().includes(t)
    );
  }
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const start = (currentPage - 1) * pageSize;
  const pageUsers = filtered.slice(start, start + pageSize);

  const container = document.getElementById('usersDynamicList');
  if (!container) return;

  if (pageUsers.length === 0){
    container.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><div>کاربری یافت نشد</div></div>';
  } else {
    container.innerHTML = pageUsers.map((user, idx) => {
      const isSelf = user.id === currentUserId;
      return `
        <div class="user-card" data-id="${user.id}" style="animation-delay:${idx * 40}ms">
          <div class="user-info">
            <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
            <div style="min-width:0">
              <div class="user-name">
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  ${escapeHtml(user.full_name || user.username)}
                </span>
                ${isSelf ? '<span class="badge-self">شما</span>' : ''}
              </div>
              <div class="user-username">@${escapeHtml(user.username)}</div>
              <div class="user-status ${user.is_active ? 'status-active' : 'status-blocked'}">
                ● ${user.is_active ? 'فعال' : 'مسدود'}
              </div>
            </div>
          </div>
          <div class="action-group">
            <button class="icon-btn ai" onclick="analyzeUserPersonality(${user.id}, '${escapeHtml(user.username)}')" title="تحلیل با AI">
              <i class="fas fa-robot"></i>
            </button>
            ${!isSelf ? `
              <button class="icon-btn block" onclick="toggleBlockUser(${user.id})" title="مسدود/فعال"><i class="fas fa-lock"></i></button>
              <button class="icon-btn edit" onclick="editUserById(${user.id})" title="ویرایش"><i class="fas fa-pen"></i></button>
              <button class="icon-btn delete" onclick="deleteUserById(${user.id})" title="حذف"><i class="fas fa-trash"></i></button>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');
  }
  renderPaginationControls(totalPages);
}

function renderPaginationControls(totalPages){
  const pag = document.getElementById('paginationControls');
  if (!pag) return;
  if (totalPages <= 1){ pag.innerHTML = ''; return; }
  let html = '';
  for (let i = 1; i <= totalPages; i++){
    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
  }
  pag.innerHTML = html;
  pag.querySelectorAll('.page-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = parseInt(btn.getAttribute('data-page'));
      if (!isNaN(p)){ currentPage = p; renderPaginatedUsers(); }
    });
  });
}

/* ============ User actions ============ */
window.toggleBlockUser = async (userId) => {
  if (userId === currentUserId){ showMsg('❌ نمی‌توانید خودتان را مسدود کنید!', true); return; }
  try {
    const r = await fetch(`/api/toggle-block/${userId}/`, { method:'POST', headers:{'X-CSRFToken':csrftoken} });
    const data = await r.json();
    showMsg(data.msg, !data.success);
    if (data.success) await loadUsers();
  } catch(e){ showMsg('خطا در ارتباط', true); }
};

window.editUserById = async (id) => {
  if (id === currentUserId){
    showMsg('برای ویرایش اطلاعات خود به بخش پروفایل مراجعه کنید', true);
    return;
  }
  try {
    const r = await fetch(`/api/users/${id}/detail/`);
    if (!r.ok){ showMsg('خطا در بارگذاری اطلاعات کاربر', true); return; }
    const data = await r.json();
    if (!data.success){ showMsg(data.msg || 'خطا در بارگذاری', true); return; }
    openUserEditModal(data);
  } catch(e){ showMsg('خطا در ارتباط با سرور', true); }
};

window.deleteUserById = async (id) => {
  if (id === currentUserId){ showMsg('❌ نمی‌توانید خودتان را حذف کنید!', true); return; }
  if (!confirm('آیا کاربر حذف شود؟ این عمل غیرقابل بازگشت است.')) return;
  try {
    const r = await fetch(`/api/delete-user/${id}/`, { method:'POST', headers:{'X-CSRFToken':csrftoken} });
    const data = await r.json();
    showMsg(data.msg, !data.success);
    if (data.success) await loadUsers();
  } catch(e){ showMsg('خطا در حذف', true); }
};

/* ============ User edit modal ============ */
function openUserEditModal(data){
  const root = document.getElementById('modalRoot');
  const u = data.user;
  const allGroups = data.all_groups || [];
  const allPerms = data.all_permissions || [];

  const groupCB = allGroups.map(g =>
    `<label><input type="checkbox" class="ue-group-cb" value="${g.id}" ${u.groups_ids.includes(g.id) ? 'checked' : ''}> ${escapeHtml(g.name)}</label>`
  ).join('') || '<span style="font-size:.75rem;color:#94a3b8">گروهی وجود ندارد</span>';

  const permCB = allPerms.map(p =>
    `<label><input type="checkbox" class="ue-perm-cb" value="${p.id}" ${u.user_permissions_ids.includes(p.id) ? 'checked' : ''}> ${escapeHtml(p.app_label)} | ${escapeHtml(p.codename)}</label>`
  ).join('') || '<span style="font-size:.75rem;color:#94a3b8">دسترسی‌ای وجود ندارد</span>';

  root.innerHTML = `
    <div class="modal-overlay" id="userEditOverlay">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title"><i class="fas fa-pen-to-square" style="color:var(--blue)"></i> ویرایش کاربر: ${escapeHtml(u.username)}</div>
          <button class="modal-close" onclick="closeUserEditModal()">×</button>
        </div>

        <div class="section-title">اطلاعات شخصی</div>
        <div class="form-grid">
          <div class="form-field"><label>نام کاربری</label><input type="text" id="ue-username" class="input-glass" value="${escapeHtml(u.username)}"></div>
          <div class="form-field"><label>ایمیل</label><input type="email" id="ue-email" class="input-glass" value="${escapeHtml(u.email)}"></div>
          <div class="form-field"><label>نام</label><input type="text" id="ue-firstname" class="input-glass" value="${escapeHtml(u.first_name)}"></div>
          <div class="form-field"><label>نام خانوادگی</label><input type="text" id="ue-lastname" class="input-glass" value="${escapeHtml(u.last_name)}"></div>
        </div>

        <div class="section-title">دسترسی‌ها</div>
        <div class="checkbox-row">
          <label><input type="checkbox" id="ue-active" ${u.is_active ? 'checked' : ''}> فعال</label>
          <label><input type="checkbox" id="ue-staff" ${u.is_staff ? 'checked' : ''}> ادمین</label>
          <label><input type="checkbox" id="ue-super" ${u.is_superuser ? 'checked' : ''}> سوپرادمین</label>
        </div>

        <div class="section-title">گروه‌ها</div>
        <div class="perm-box" style="max-height:140px">${groupCB}</div>

        <div class="section-title">دسترسی‌های مستقیم کاربر</div>
        <div class="perm-box">${permCB}</div>

        <div class="section-title">تاریخ‌ها</div>
        <div style="font-size:.8rem;color:#475569;display:flex;flex-direction:column;gap:4px">
          <div>آخرین ورود: ${escapeHtml(u.last_login || '—')}</div>
          <div>تاریخ عضویت: ${escapeHtml(u.date_joined || '—')}</div>
        </div>

        <div class="section-title">تغییر رمز عبور (اختیاری)</div>
        <input type="password" id="ue-password" class="input-glass" placeholder="رمز جدید (خالی بگذارید تا تغییر نکند)">

        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeUserEditModal()">لغو</button>
          <button class="btn btn-primary" onclick="saveUserEdit(${u.id})"><i class="fas fa-floppy-disk"></i> ذخیره</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('userEditOverlay').addEventListener('click', e => {
    if (e.target.id === 'userEditOverlay') closeUserEditModal();
  });
}

function closeUserEditModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

window.saveUserEdit = async (userId) => {
  const payload = {
    username: document.getElementById('ue-username').value.trim(),
    email: document.getElementById('ue-email').value.trim(),
    first_name: document.getElementById('ue-firstname').value.trim(),
    last_name: document.getElementById('ue-lastname').value.trim(),
    is_active: document.getElementById('ue-active').checked,
    is_staff: document.getElementById('ue-staff').checked,
    is_superuser: document.getElementById('ue-super').checked,
    groups_ids: Array.from(document.querySelectorAll('.ue-group-cb:checked')).map(cb => parseInt(cb.value)),
    user_permissions_ids: Array.from(document.querySelectorAll('.ue-perm-cb:checked')).map(cb => parseInt(cb.value)),
  };
  const pwd = document.getElementById('ue-password').value;
  if (pwd) payload.new_password = pwd;

  try {
    const r = await fetch(`/api/users/${userId}/update/`, {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':csrftoken},
      body: JSON.stringify(payload)
    });
    const data = await r.json();
    if (data.success){
      showMsg('تغییرات ذخیره شد');
      closeUserEditModal();
      await loadUsers();
    } else showMsg(data.msg || 'خطا در ذخیره', true);
  } catch(e){ showMsg('خطا در ارتباط با سرور', true); }
};

/* ============ AI analysis ============ */
window.analyzeUserPersonality = async (userId, username) => {
  currentAITarget = { id: userId, username };
  const root = document.getElementById('modalRoot');

  root.innerHTML = `
    <div class="modal-overlay" id="aiOverlay">
      <div class="modal-content" style="max-width:820px">
        <div class="modal-header">
          <div class="modal-title"><i class="fas fa-robot" style="color:var(--purple)"></i> تحلیل هوش مصنوعی · ${escapeHtml(username)}</div>
          <button class="modal-close" onclick="closeAIModal()">×</button>
        </div>
        <div id="aiAnalysisResult">
          <div class="loading-box">
            <div class="spinner"></div>
            <div>🤖 در حال تحلیل عمیق شخصیت کاربر...</div>
            <div style="font-size:.75rem;color:#94a3b8">⏳ این فرآیند ممکن است ۳۰ تا ۶۰ ثانیه طول بکشد</div>
          </div>
        </div>
        <div class="modal-footer" id="aiFooter" style="display:none">
          <button class="btn btn-ghost" onclick="closeAIModal()">بستن</button>
          <button class="btn btn-primary" onclick="copyToClipboard()"><i class="fas fa-copy"></i> کپی متن</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('aiOverlay').addEventListener('click', e => {
    if (e.target.id === 'aiOverlay') closeAIModal();
  });

  try {
    const r = await fetch(`/api/analyze-user-personality/${userId}/`);
    const data = await r.json();
    const resultDiv = document.getElementById('aiAnalysisResult');
    const footer = document.getElementById('aiFooter');

    if (data.success){
      currentAnalysis = data.analysis || '';
      let statsHtml = '';
      if (data.stats){
        const typeCount = Object.keys(data.stats.file_types || {}).length;
        const suspicious = (data.stats.suspicious_files && data.stats.suspicious_files.length > 0)
          ? `<div>⚠️ فایل‌های مشکوک: ${escapeHtml(data.stats.suspicious_files.join(', '))}</div>` : '';
        statsHtml = `
          <div class="stats-box">
            <strong>📊 آمار فایل‌های کاربر</strong>
            <div>تعداد کل: ${data.stats.total_files}</div>
            <div>تنوع فایل‌ها: ${typeCount} نوع</div>
            ${suspicious}
          </div>
        `;
      }
      resultDiv.innerHTML = statsHtml + `<div class="ai-result">${escapeHtml(currentAnalysis)}</div>`;
      footer.style.display = 'flex';
    } else {
      resultDiv.innerHTML = `<div class="ai-result" style="color:var(--red)">❌ خطا: ${escapeHtml(data.error || 'تحلیل انجام نشد')}</div>`;
      footer.style.display = 'flex';
    }
  } catch(e){
    document.getElementById('aiAnalysisResult').innerHTML =
      `<div class="ai-result" style="color:var(--red)">❌ خطا در ارتباط با سرور: ${escapeHtml(String(e))}</div>`;
    document.getElementById('aiFooter').style.display = 'flex';
  }
};

function closeAIModal(){
  document.getElementById('modalRoot').innerHTML = '';
  currentAnalysis = '';
  currentAITarget = null;
}

function copyToClipboard(){
  if (currentAnalysis){
    navigator.clipboard.writeText(currentAnalysis);
    showMsg('✅ متن تحلیل کپی شد');
  } else showMsg('❌ متنی برای کپی وجود ندارد', true);
}

/* ============ Search / policy / back ============ */
document.getElementById('searchUsersInput').addEventListener('input', (e) => {
  currentSearchTerm = e.target.value;
  currentPage = 1;
  renderPaginatedUsers();
});

document.getElementById('savePolicyBtn').addEventListener('click', async () => {
  const minLen = document.getElementById('minLengthInput').value;
  try {
    const r = await fetch('/api/set-password-policy/', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':csrftoken},
      body: JSON.stringify({min_length: minLen})
    });
    const data = await r.json();
    showMsg(data.msg, !data.success);
  } catch(e){ showMsg('خطا', true); }
});

document.getElementById('backHomeBtn').addEventListener('click', () => {
  window.location.href = '/admin-panel/';
});

/* ============ Boot ============ */
window.addEventListener('DOMContentLoaded', async () => {
  await fetchInitialData();
  await loadUsers();
});
</script>
